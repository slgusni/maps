<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Middle East Strikes — DoD Briefing Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; font-family: Arial, sans-serif; background: #111; }
  #container { display: flex; flex-direction: column; width: 100%; height: 100vh; }
  #header {
    background: rgba(0,0,0,0.85); color: #f0e0c0;
    padding: 8px 14px; font-size: 14px; font-weight: bold;
    letter-spacing: 0.5px; border-bottom: 1px solid #444; flex-shrink: 0;
    display: flex; justify-content: space-between; align-items: center;
  }
  #header span { font-size: 11px; font-weight: normal; color: #aaa; margin-left: 10px; }
  #header .source { font-size: 10px; color: #888; font-style: italic; }
  #map { flex: 1; width: 100%; min-height: 0; }
  .leaflet-container { background: #1a2a3a; }
  .legend {
    background: rgba(0,0,0,0.75); padding: 8px 12px;
    border-radius: 6px; color: #ddd; font-size: 11px; line-height: 22px;
  }
  .legend-item { display: flex; align-items: center; gap: 7px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.4); }
  .leaflet-popup-content-wrapper {
    background: rgba(20,20,30,0.95); color: #eee;
    border: 1px solid #555; border-radius: 6px; box-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }
  .leaflet-popup-tip { background: rgba(20,20,30,0.95); }
  .leaflet-popup-content { margin: 10px 14px; font-size: 12px; line-height: 1.6; }
  .popup-title { font-weight: bold; font-size: 13px; margin-bottom: 4px; }
  .popup-type-iranian-strike { color: #ff3333; }
  .popup-type-us-israeli-strike { color: #ff9900; }
  .popup-type-us-base { color: #4a90d9; }
  .popup-type-air-defense { color: #ff6600; }
  .popup-type-nuclear { color: #00cc44; }
</style>
</head>
<body>

  <div id="header">
    <div>🎯 Middle East Strikes
      <span>DoD Unclassified Briefing Map — Feb 28, 2026</span>

  <div id="map"></div>
</div>

  // ── IRANIAN AIR DEFENSES STRUCK ──────────────────────────────
  {
    lat: 37.2000, lng: 49.5000,

  },
  {

  },
  {

  },
  {

  },
  {

  },

  // ── NUCLEAR SITES ─────────────────────────────────────────────
  {
    lat: 35.7219, lng: 51.3347,
    name: "Tehran Nuclear Research Center",
    type: "nuclear",
    detail: "Iranian nuclear research facility in Tehran. Identified on DoD unclassified briefing map."
  },
  {
    lat: 34.0954, lng: 49.6975,
    name: "Arak Heavy Water Reactor",
    type: "nuclear",
    detail: "Iran's IR-40 heavy water nuclear reactor at Arak. Identified on DoD unclassified briefing map."
  },
  {
    lat: 32.6546, lng: 51.6680,
    name: "Isfahan Nuclear Technology Center",
    type: "nuclear",
    detail: "Major Iranian nuclear facility at Isfahan. Identified on DoD unclassified briefing map."
  }
];

const TYPE_CONFIG = {
  "iranian-strike": { color: "#ff3333", label: "Iranian Strike" },
  "us-israeli-strike": { color: "#ff9900", label: "U.S./Israeli Strike" },
  "us-base": { color: "#4a90d9", label: "U.S. Base" },
  "air-defense": { color: "#ff6600", label: "Iranian Air Defense (Struck)" },
  "nuclear": { color: "#00cc44", label: "Nuclear Site" }
};

const lats = LOCATIONS.map(l => l.lat);
const lngs = LOCATIONS.map(l => l.lng);
const bounds = [[Math.min(...lats)-2, Math.min(...lngs)-2], [Math.max(...lats)+2, Math.max(...lngs)+2]];

const map = L.map('map', {
  zoomControl: true,
  attributionControl: true
}).fitBounds(bounds);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  crossOrigin: true
}).addTo(map);

LOCATIONS.forEach(loc => {
  const cfg = TYPE_CONFIG[loc.type] || TYPE_CONFIG["us-base"];

  const marker = L.circleMarker([loc.lat, loc.lng], {
    radius: 9,
    color: cfg.color,
    fillColor: cfg.color,
    fillOpacity: 0.85,
    weight: 2
  }).addTo(map);

  L.circleMarker([loc.lat, loc.lng], {
    radius: 16, color: cfg.color, fillOpacity: 0, weight: 1, opacity: 0.4,
    interactive: false
  }).addTo(map);

  marker.bindPopup(`
    <div class="popup-title popup-type-${loc.type}">${loc.name}</div>
    <div><strong>Type:</strong> ${cfg.label}</div>
    ${loc.detail ? `<div style="margin-top:4px">${loc.detail}</div>` : ''}
    <div style="margin-top:6px;color:#888;font-size:10px;font-style:italic">Source: Department of Defense</div>
  `, { maxWidth: 260 });
});

// USNI News logo
const logo = L.control({ position: 'bottomleft' });
logo.onAdd = () => {
  const d = L.DomUtil.create('div');
  d.style.cssText = 'padding:4px 6px;background:rgba(0,0,0,0.6);border-radius:4px;';
  d.innerHTML = '<img src="https://news.usni.org/wp-content/uploads/2016/02/usni_logo.png" style="height:28px;display:block;">';
  return d;
};
logo.addTo(map);

// Legend
const legend = L.control({ position: 'bottomright' });
legend.onAdd = () => {
  const d = L.DomUtil.create('div', 'legend');
  d.innerHTML = Object.entries(TYPE_CONFIG).map(([, cfg]) =>
    `<div class="legend-item">
      <div class="legend-dot" style="background:${cfg.color}"></div>
      ${cfg.label}
    </div>`
  ).join('');
  return d;
};
legend.addTo(map);
</script>
</body>
</html>
