<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Western Pacific Pulse &mdash; Week of October 9, 2026</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  #wrap { display:flex; flex-direction:column; height:100vh; min-height:520px; }

  header { background:#2d2d2d; color:#fff; padding:8px 12px 6px; display:flex; align-items:center; gap:12px; flex:0 0 auto; }
  header img { height:26px; width:auto; display:block; }
  .htxt h1 { margin:0; font-size:15px; font-weight:700; letter-spacing:.02em; }
  .htxt .date { margin:0 0 2px; font-size:10px; font-weight:700; letter-spacing:.1em;
                text-transform:uppercase; color:#e8687d; }
  .htxt p  { margin:2px 0 0; font-size:11px; color:#b8b8b8; }
  .accent { height:4px; background:#c8102e; flex:0 0 auto; }

  #mapshell { position:relative; flex:1 1 auto; min-height:240px; }
  #map { position:absolute; inset:0; background:#dfe6ec; }

  /* Text block, left side of the map */
  #card { position:absolute; top:10px; left:10px; width:320px; max-width:calc(100% - 20px);
          max-height:calc(100% - 20px); overflow-y:auto; background:rgba(255,255,255,.96);
          border:1px solid #ccc; border-left:4px solid #c8102e; border-radius:3px;
          padding:10px 12px; z-index:600; box-shadow:0 1px 6px rgba(0,0,0,.25);
          text-align:left; }
  #card .force { font-size:9.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:#fff;
                 display:inline-block; padding:2px 6px; border-radius:2px; text-align:left; }
  #card h2 { margin:7px 0 2px; font-size:14.5px; line-height:1.25; color:#1a1a1a; text-align:left; }
  #card .loc { font-size:11px; color:#666; margin:0 0 6px; font-weight:600; text-align:left; }
  #card #c-text { margin:0; font-size:12px; line-height:1.5; color:#333; text-align:left; }

  #legend { position:absolute; bottom:10px; right:10px; background:rgba(255,255,255,.94); border:1px solid #ccc;
            border-radius:3px; padding:7px 9px; z-index:600; font-size:10.5px; color:#333; line-height:1.55;
            text-align:left; }
  #legend b { display:block; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:#666; margin-bottom:3px; }
  #legend span.k { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle; }

  #ctrl { flex:0 0 auto; background:#2d2d2d; color:#fff; padding:8px 12px 10px; }
  .row { display:flex; align-items:center; gap:9px; }
  button { background:#4a4a4a; color:#fff; border:1px solid #6a6a6a; border-radius:3px; font-size:12px;
           padding:4px 10px; cursor:pointer; min-width:34px; }
  button:hover { background:#c8102e; border-color:#c8102e; }
  button:focus-visible { outline:2px solid #fff; outline-offset:1px; }
  input[type=range] { flex:1 1 auto; accent-color:#c8102e; height:20px; }
  #counter { font-size:11px; color:#b8b8b8; white-space:nowrap; min-width:96px; text-align:right; }
  #tick { font-size:11px; color:#e6e6e6; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  @media (max-width:640px){
    /* Anchor to the bottom of the map area. Must stay positioned, or z-index
       is ignored and the card renders beneath the Leaflet tiles. */
    #card { top:auto; bottom:0; left:0; right:0; width:auto; max-width:none;
            max-height:46%; overflow-y:auto;
            border:none; border-top:4px solid #c8102e; border-radius:0;
            box-shadow:0 -2px 8px rgba(0,0,0,.28); padding:9px 12px 11px; }
    #card h2 { font-size:13.5px; }
    /* Legend moves up top so it doesn't sit behind the card */
    #legend { top:10px; bottom:auto; right:10px; font-size:9.5px; padding:5px 7px; line-height:1.45; }
  }
</style>
</head>
<body>
<div id="wrap">

  <header>
    <img src="USNI_News_Logo.png" alt="USNI News">
    <div class="htxt">
      <p class="date">Week of October 9, 2026</p>
      <h1>Western Pacific Pulse</h1>
      <p>Naval and air activity across the Indo-Pacific</p>
    </div>
  </header>
  <div class="accent"></div>

  <div id="mapshell">
    <div id="map"></div>
    <div id="card">
      <span class="force" id="c-force"></span>
      <h2 id="c-title"></h2>
      <p class="loc" id="c-loc"></p>
      <p id="c-text"></p>
    </div>
    <div id="legend">
      <b>Forces</b>
      <div><span class="k" style="background:#dc2626"></span>PLA / China</div>
      <div><span class="k" style="background:#8b5cf6"></span>Russian Navy</div>
      <div><span class="k" style="background:#0891b2"></span>U.S. Navy</div>
      <div><span class="k" style="background:#f59e0b"></span>JMSDF / JASDF</div>
      <div><span class="k" style="background:#FF6B35"></span>DPRK</div>
      <div><span class="k" style="background:#16a34a"></span>Allied / partner navies</div>
      <div><span class="k" style="background:#84cc16"></span>Exercises &amp; training</div>
    </div>
  </div>

  <div id="ctrl">
    <div class="row">
      <button id="prev" aria-label="Previous incident">&#9664;</button>
      <button id="play" aria-label="Play sequence">&#9654;</button>
      <button id="next" aria-label="Next incident">&#9654;&#9654;</button>
      <input type="range" id="slider" min="0" max="0" value="0" step="1" aria-label="Step through incidents">
      <div id="counter"></div>
    </div>
    <div id="tick"></div>
  </div>

</div>

<script>
/* ---------- Week of October 9, 2026 ----------
   Each caption is the opening line or two of the filed editorial copy, unedited.
   Marker positions are the uploaded KML placemarks; track endpoints come from
   the bearings and distances given in the copy. */
const WEEK = "Week of October 9, 2026";

const incidents = [
  { force:"U.S. Navy", color:"#0891b2", lat:7.9843, lng:98.3307,
    vesselShort:"USS George H.W. Bush (CVN-77), USS Delbert D. Black (DDG-119)",
    location:"In Phuket, Thailand",
    text:`Aircraft carrier USS George H.W. Bush (CVN-77) and destroyer USS Delbert D. Black (DDG-119) departed Thursday from Phuket, Thailand, following a port visit that began on Sunday. Phuket was the carrier's first port visit since it deployed in March from Norfolk, Va.` },

  { force:"U.S. Navy", color:"#0891b2", lat:21.1828, lng:169.8455,
    vesselShort:"USS Theodore Roosevelt (CVN-71), USS Chosin (CG-65), USS Paul Hamilton (DDG-60), USS Decatur (DDG-73)",
    location:"In the Pacific Ocean",
    text:`The Theodore Roosevelt CSG is operating in the Pacific Ocean in U.S. 7th Fleet, as of Friday, according to a Defense Department imagery release. The strike group includes aircraft carrier USS Theodore Roosevelt (CVN-71), air defense commander and cruiser USS Chosin (CG-65) and destroyers USS Paul Hamilton (DDG-60) and USS Decatur (DDG-73).` },

  { force:"U.S. Navy", color:"#0891b2", lat:1.4600, lng:103.8200,
    vesselShort:"USS Mason (DDG-87)",
    location:"In Singapore",
    text:`Destroyer USS Mason (DDG-87) arrived Monday in Sembawang, Singapore, for a port visit. Mason, homeported in Mayport, Fla., is assigned to the George H.W Bush Carrier Strike Group and serves as the air defense commander for the strike group.` },

  { force:"U.S. Navy", color:"#0891b2", lat:1.4450, lng:103.7900,
    vesselShort:"USS Wayne E. Meyer (DDG-108)",
    location:"In Singapore",
    text:`Destroyer USS Wayne E. Meyer (DDG-108) departed on Monday from Sembawang Singapore, according local ship spotters. Wayne E. Meyer, homeported in Pearl Harbor, Hawaii, is forward-deployed and assigned to DESRON 15.` },

  { force:"Exercise / training", color:"#84cc16", lat:1.3200, lng:103.9867,
    vesselShort:"FPDA exercise Bersama Lima",
    location:"In Singapore",
    text:`The Five Power Defence Arrangement (FPDA) exercise Bersama Lima kicked off on Tuesday with an opening ceremony at Changi Naval Base. The exercise will run until Oct. 23 with the field training phase held in Singapore, Malaysia and the South China Sea beginning on Oct. 12.` },

  { force:"Allied / partner", color:"#16a34a", lat:2.9999, lng:101.3928,
    vesselShort:"ITS Giovanni delle Bande Nere (P434)",
    location:"In Port Klang, Malaysia",
    text:`Italian Navy multi-purpose combat ship ITS Giovanni delle Bande Nere (P434) arrived Thursday at Port Klang Cruise Terminal for a port visit until Sunday. Giovanni delle Bande Nere is on the homeward bound leg of an Indo-Pacific deployment.` },

  { force:"Russian Navy", color:"#8b5cf6", lat:-6.1383, lng:106.8665,
    vesselShort:"RFS Marshal Shaposhnikov (543), RFS Admiral Tributs (564), Pechenga",
    location:"In Tanjung Priok, Jakarta",
    text:`The Russian Navy Pacific Fleet surface action group departed Sunday from Tanjung Priok, Jakarta, following a port visit that began on Sept. 30. The surface action group includes destroyers RFS Marshal Shaposhnikov (543) and RFS Admiral Tributs (564) and fleet oiler Pechenga.` },

  { force:"PLA / China", color:"#dc2626", lat:5.9844, lng:116.0773,
    vesselShort:"CNS Tangshan (122), CNS Daqing (576), CNS Taihu (889)",
    location:"In Kota Kinabalu, Malaysia",
    text:`The People's Liberation Army Navy 48th Escort Task Group pulled into Royal Malaysian Navy (RMN) Kota Kinabalu Naval Base on Thursday for a five-day visit. The task group includes destroyer CNS Tangshan (122), CNS frigate Daqing (576) and fleet oiler CNS Taihu (889).` },

  { force:"JMSDF / JASDF", color:"#f59e0b", lat:0.5101, lng:108.9124,
    vesselShort:"JS Kunisaki (LST-4003)",
    location:"In Kijing Port, West Kalimantan, Indonesia",
    text:`Japan Maritime Self-Defense Force amphibious tank landing ship JS Kunisaki (LST-4003) and three Japan Ground Self-Defense Force CH-47 helicopters departed Tuesday from Kijing Port to return to Japan after supporting Indonesian authorities in combating forest fires in West Kalimantan.` },

  { force:"PLA / China", color:"#dc2626", lat:15.2191, lng:117.7403,
    vesselShort:"PLAAF J-16 fighters and a Philippine Air Force Cessna C-208",
    location:"Near Scarborough Shoal",
    text:`The People's Liberation Army Southern Theater Command expelled a Philippines Air Force Cessna C-208 patrol aircraft from the Scarborough Shoal airspace on Sunday, the command said. The Philippine Air Force patrol aircraft is accused of illegally intruding into Chinese airspace, the PLA said.` },

  { force:"DPRK", color:"#FF6B35", lat:39.1539, lng:127.4460,
    vesselShort:"Hypersonic ballistic missile",
    location:"In Wonsan, North Korea",
    text:`North Korea launched a hypersonic ballistic missile at a target in the Sea of Japan on Saturday, state media Korean Central News Agency reported. According to state media, the missile flew for 1,000 kilometers \u2013 621 miles \u2013 while South Korea's Joint Chiefs of Staff estimated it flew around 700 kilometers \u2013 435 miles.` },

  { force:"Allied / partner", color:"#16a34a", lat:35.1731, lng:129.0714,
    vesselShort:"HMCS Regina (FFH334)",
    location:"In Busan, South Korea",
    text:`Royal Canadian Navy frigate HMCS Regina (FFH334) docked Saturday in Busan for a port visit. Regina is on deployment under Operation Horizon, the Canadian Armed Forces' ongoing presence and engagement deployment to the Indo-Pacific.` },

  { force:"PLA / China", color:"#dc2626", lat:30.3953, lng:125.9152,
    path:[[28.50,122.60],[26.60,126.40],[31.40,128.20],[31.70,124.20]],
    vesselShort:"TB-001 reconnaissance/attack UAV",
    location:"In the East China Sea",
    text:`On Friday, a Chinese TB-001 reconnaissance/attack Unmanned Aerial Vehicle flew east from the Chinese mainland before changing course to head northeast while it was west of Okinawa. While south of the Danjo Islands, the drone changed course to head towards China, according to Japan's Joint Staff Office.` },

  { force:"U.S. Navy", color:"#0891b2", lat:35.2815, lng:139.6722,
    vesselShort:"USS Ralph Johnson (DDG-114)",
    location:"In Yokosuka, Japan",
    text:`Destroyer USS Ralph Johnson (DDG-114) returned on Saturday to Commander Fleet Activities Yokosuka (CFAY) on Saturday, according to local ship spotters.` },

  { force:"U.S. Navy", color:"#0891b2", lat:35.2660, lng:139.7020,
    vesselShort:"USS Howard (DDG-83)",
    location:"In Yokosuka, Japan",
    text:`Destroyer USS Howard (DDG-83) departed CFAY on Thursday, according to photographs by local ship spotters.` },

  { force:"Allied / partner", color:"#16a34a", lat:26.1202, lng:127.7025,
    vesselShort:"French Navy Falcon 50M MPA",
    location:"In Okinawa, Japan",
    text:`A French Navy Falcon 50M MPA will operate from Kadena Air Base, Okinawa, until early November, to carry out monitoring and surveillance activities against North Korean sanctions evasion activities at sea. A Japan MOD release stated that this will be the seventh time a French aircraft engaged in these activities since 2019.` },

  { force:"Russian Navy", color:"#8b5cf6", lat:45.8102, lng:141.9262,
    path:[[45.76,140.50],[45.8102,141.9262],[46.10,142.75]],
    vesselShort:"RFS Sovershennyy (333)",
    location:"In La P\u00e9rouse Strait",
    text:`Russian Navy corvette RFS Sovershennyy (333) was sighted sailing east 60 kilometers \u2013 37 miles \u2013 northwest of Rebun Island at 5 a.m. local time on Friday and subsequently sailed east through La P\u00e9rouse Strait to enter the Sea of Okhotsk. La P\u00e9rouse Strait separates Japan's main island of Hokkaido and Russia's Sakhalin Island.` },

  { force:"Russian Navy", color:"#8b5cf6", lat:43.2203, lng:142.8635,
    path:[[49.50,145.40],[45.60,145.10],[42.60,143.60],[39.70,142.95],[42.40,143.85],[45.40,145.40],[49.40,145.90]],
    vesselShort:"IL-20 Electronic Intelligence aircraft",
    location:"In Hokkaido, Japan",
    text:`On Friday a Russia IL-20 Electronic Intelligence aircraft flew in from the Russian mainland and through the Sea of Okhotsk until it reached the Pacific Ocean. Then, the aircraft flew south until it was parallel to Iwate Prefecture, located on the northeast coast of the main island of Honshu.` },

  { force:"Allied / partner", color:"#16a34a", lat:-12.4637, lng:130.8444,
    vesselShort:"HMAS Choules (L100)",
    location:"In Darwin, Australia",
    text:`Royal Australian Navy amphibious dock landing ship HMAS Choules (L100) transported explosives on Tuesday prior to departing for Indonesia for Indonesia-Australia bilateral exercise Keris Woomera 2026.` }
];

/* ---------- Map ---------- */
const map = L.map('map', { zoomControl:true, scrollWheelZoom:true, worldCopyJump:false,
                           center:[18.0, 130.0], zoom:3 });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:12, attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

/* An incident may carry one track (path), several (paths), and extra
   secondary sites (also) that share its caption. */
incidents.forEach(inc => {
  inc._tracks = inc.paths ? inc.paths : (inc.path ? [inc.path] : []);
  inc._also = inc.also || [];
});

const pts = [];
incidents.forEach(inc => {
  if (inc.lng <= 180) pts.push([inc.lat, inc.lng]);
  inc._also.forEach(p => { if (p[1] <= 180) pts.push(p); });
  inc._tracks.forEach(t => t.forEach(p => { if (p[1] <= 180) pts.push(p); }));
});
const BOUNDS = L.latLngBounds(pts);

/* Fit only once the container actually has a size. A lazy-loaded, hidden or
   not-yet-laid-out iframe reports 0x0, and Leaflet then falls back to maxZoom,
   which opens the map fully zoomed in. Retry until a real size shows up. */
let fitted = false;
function fitAll(){
  const s = map.getSize();
  if (s.x < 60 || s.y < 60) return;
  map.invalidateSize(false);
  map.fitBounds(BOUNDS, { padding:[34,34] });
  fitted = true;
}
fitAll();
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(() => {
    if (!fitted) fitAll(); else map.invalidateSize(false);
  }).observe(document.getElementById('mapshell'));
}
window.addEventListener('load',   () => { if (!fitted) fitAll(); });
window.addEventListener('resize', () => { if (!fitted) fitAll(); else map.invalidateSize(false); });

incidents.forEach(inc => {
  inc._lines = inc._tracks.map(t => L.polyline(t, {
    color: inc.color, weight: 2, dashArray: '6,7', opacity: 0.12, interactive: false
  }).addTo(map));
});

incidents.forEach((inc, i) => {
  inc._sub = inc._also.map(p => L.circleMarker(p, {
    radius: 5, color: '#ffffff', weight: 1.5, fillColor: inc.color, fillOpacity: 0.18, opacity: 0.28
  }).addTo(map));
  inc._m = L.circleMarker([inc.lat, inc.lng], {
    radius: 7, color: '#ffffff', weight: 2, fillColor: inc.color, fillOpacity: 0.18, opacity: 0.28
  }).addTo(map);
  inc._m.on('click', () => setIndex(i));
});

/* ---------- Slider ---------- */
const slider  = document.getElementById('slider');
const counter = document.getElementById('counter');
const tick    = document.getElementById('tick');
const cardEl  = document.getElementById('card');
slider.max = incidents.length - 1;

let idx = 0, timer = null;

function setIndex(n) {
  idx = Math.max(0, Math.min(incidents.length - 1, n));
  slider.value = idx;

  incidents.forEach((inc, i) => {
    const shown   = i <= idx;
    const current = i === idx;
    inc._m.setStyle({
      fillOpacity: shown ? 0.95 : 0.18,
      opacity:     shown ? 1 : 0.28,
      weight:      current ? 3 : 2
    });
    inc._m.setRadius(current ? 11 : (shown ? 7.5 : 6));
    if (current) inc._m.bringToFront();
    inc._sub.forEach(s => s.setStyle({
      fillOpacity: shown ? 0.85 : 0.18, opacity: shown ? 0.95 : 0.28
    }));
    inc._lines.forEach(l => l.setStyle({ opacity: shown ? 0.75 : 0.12 }));
  });

  const inc = incidents[idx];
  const f = document.getElementById('c-force');
  f.textContent = inc.force;
  f.style.background = inc.color;
  document.getElementById('c-title').textContent = inc.vesselShort;
  document.getElementById('c-loc').textContent   = inc.location + ' \u00b7 ' + WEEK;
  document.getElementById('c-text').textContent  = inc.text;
  cardEl.scrollTop = 0;

  counter.textContent = (idx + 1) + ' of ' + incidents.length;
  tick.textContent = inc.location;
}

document.getElementById('prev').onclick = () => { stop(); setIndex(idx - 1); };
document.getElementById('next').onclick = () => { stop(); setIndex(idx + 1); };
slider.oninput = () => { stop(); setIndex(parseInt(slider.value, 10)); };

const playBtn = document.getElementById('play');
function stop() { if (timer) { clearInterval(timer); timer = null; playBtn.innerHTML = '&#9654;'; } }
playBtn.onclick = () => {
  if (timer) { stop(); return; }
  if (idx >= incidents.length - 1) setIndex(0);
  playBtn.innerHTML = '&#10074;&#10074;';
  timer = setInterval(() => {
    if (idx >= incidents.length - 1) { stop(); return; }
    setIndex(idx + 1);
  }, 3400);
};

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { stop(); setIndex(idx + 1); }
  if (e.key === 'ArrowLeft')  { stop(); setIndex(idx - 1); }
});

setIndex(0);
</script>
</body>
</html>
