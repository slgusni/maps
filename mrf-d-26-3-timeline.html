<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marine Rotational Force-Darwin 26.3</title>
<style>
  :root {
    --ocean: #c8c8c8;
    --land: #ffffff;
    --ink: #111111;
    --sub: #666666;
    --red: #a92a30;
    --rule: #b4b4b4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ocean); }
  body {
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .graphic { position: relative; padding: 18px 0 20px; }

  header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; padding: 0 22px;
  }
  h1 { margin: 0; font-size: clamp(22px, 3.2vw, 34px); line-height: 1.1; font-weight: 700; letter-spacing: .2px; }
  .dates { margin: 4px 0 0; font-size: clamp(16px, 2.2vw, 24px); font-weight: 700; color: var(--sub); letter-spacing: .6px; }
  .logo { height: clamp(28px, 4.4vw, 52px); width: auto; flex-shrink: 0; }

  .controls { display: flex; gap: 8px; padding: 14px 22px 0; align-items: center; }
  .controls button {
    width: 38px; height: 38px; border-radius: 50%;
    border: 0; background: var(--land); color: var(--red);
    font-size: 18px; line-height: 1; cursor: pointer;
  }
  .controls button:disabled { color: #bbb; cursor: default; }
  .controls button:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  .progress { flex: 1; height: 3px; background: #b0b0b0; margin-left: 8px; position: relative; max-width: 260px; }
  .progress span { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--red); }

  .scroller {
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x proximity; scroll-behavior: smooth;
    scrollbar-width: thin; scrollbar-color: #999 transparent;
    cursor: grab; padding: 6px 0 14px; scroll-padding-left: 22px;
  }
  .scroller.dragging { cursor: grabbing; scroll-snap-type: none; scroll-behavior: auto; user-select: none; }
  .scroller:focus-visible { outline: 3px solid var(--red); outline-offset: -3px; }

  .track { display: flex; align-items: stretch; padding: 0 22px; width: max-content; position: relative; }

  .stop { scroll-snap-align: start; flex: 0 0 auto; width: 250px; position: relative; display: flex; flex-direction: column; }
  .stop + .stop { margin-left: 0; }
  .month { height: 22px; font-size: 14px; font-weight: 700; color: var(--sub); padding-left: 2px; white-space: nowrap; }
  .axis { position: relative; height: 22px; }
  .axis::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--land); }
  .stop:last-child .axis::before { right: auto; width: 12px; }
  .dot { position: absolute; left: 4px; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: var(--red); }
  .card {
    background: var(--land); margin: 8px 18px 0 0; padding: 14px 16px 16px;
    flex: 1; display: flex; flex-direction: column;
  }
  .card figure { margin: auto 0 0; padding-top: 14px; }
  .card figure img { display: block; width: 100%; height: auto; }
  .card figcaption { font-size: 11px; color: var(--sub); padding-top: 4px; }
  .when { font-size: 14px; font-weight: 700; color: var(--red); margin: 0 0 6px; }
  .card h2 { font-size: 18px; line-height: 1.2; margin: 0 0 3px; font-weight: 700; }
  .where { font-size: 13px; color: var(--sub); margin: 0 0 10px; font-style: italic; }
  .card p.body { font-size: 14px; line-height: 1.5; margin: 0; }

  @media (max-width: 560px) {
    .stop { width: 78vw; }
  }
  @media (prefers-reduced-motion: reduce) { .scroller { scroll-behavior: auto; } }
</style>
</head>

const track = document.getElementById("track");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
track.insertAdjacentHTML("beforeend", stops.map(s => `
  <article class="stop">
    <div class="month">${esc(s.month)}</div>
    <div class="axis"><span class="dot"></span></div>
    <div class="card">
      <p class="when">${esc(s.when)}</p>
      <h2>${esc(s.title)}</h2>
      ${s.where ? `<p class="where">${esc(s.where)}</p>` : ""}
      <p class="body">${esc(s.body)}</p>
      ${s.photo ? `<figure><img src="${s.photo}" alt="" draggable="false"><figcaption>U.S. Marine Corps photo</figcaption></figure>` : ""}
    </div>
  </article>`).join(""));

const sc = document.getElementById("scroller");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const bar = document.getElementById("bar");

function step() { const st = track.querySelector(".stop"); return st ? st.offsetWidth * 2 : 300; }
prev.addEventListener("click", () => sc.scrollBy({ left: -step() }));
next.addEventListener("click", () => sc.scrollBy({ left: step() }));
sc.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { sc.scrollBy({ left: step() / 2 }); e.preventDefault(); }
  if (e.key === "ArrowLeft")  { sc.scrollBy({ left: -step() / 2 }); e.preventDefault(); }
});
function update() {
  const max = sc.scrollWidth - sc.clientWidth;
  const p = max > 0 ? sc.scrollLeft / max : 1;
  bar.style.width = (p * 100) + "%";
  prev.disabled = sc.scrollLeft <= 2;
  next.disabled = sc.scrollLeft >= max - 2;
}
sc.addEventListener("scroll", update, { passive: true });
window.addEventListener("resize", update);
update();

/* click-and-drag with a mouse */
let down = false, startX = 0, startLeft = 0, moved = false;
sc.addEventListener("pointerdown", e => {
  if (e.pointerType !== "mouse") return;
  down = true; moved = false; startX = e.clientX; startLeft = sc.scrollLeft;
});
window.addEventListener("pointermove", e => {
  if (!down) return;
  const dx = e.clientX - startX;
  if (Math.abs(dx) > 4) { moved = true; sc.classList.add("dragging"); }
  if (moved) sc.scrollLeft = startLeft - dx;
});
window.addEventListener("pointerup", () => { down = false; sc.classList.remove("dragging"); });
</script>
