<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Western Pacific Pulse &mdash; Week of September 25, 2026</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  #wrap { display:flex; flex-direction:column; height:100vh; min-height:520px; }

  header { background:#2d2d2d; color:#fff; padding:8px 12px 6px; display:flex; align-items:center; gap:12px; flex:0 0 auto; }
  header img { height:26px; width:auto; display:block; }
  .htxt h1 { margin:0; font-size:15px; font-weight:700; letter-spacing:.02em; }
  .htxt .date { margin:0 0 2px; font-size:10px; font-weight:700; letter-spacing:.1em;
                text-transform:uppercase; color:#e8687d; }
  .htxt p  { margin:2px 0 0; font-size:11px; color:#b8b8b8; }
  .accent { height:4px; background:#c8102e; flex:0 0 auto; }

  #mapshell { position:relative; flex:1 1 auto; min-height:240px; }
  #map { position:absolute; inset:0; background:#dfe6ec; }

  /* Text block, left side of the map */
  #card { position:absolute; top:10px; left:10px; width:320px; max-width:calc(100% - 20px);
          max-height:calc(100% - 20px); overflow-y:auto; background:rgba(255,255,255,.96);
          border:1px solid #ccc; border-left:4px solid #c8102e; border-radius:3px;
          padding:10px 12px; z-index:600; box-shadow:0 1px 6px rgba(0,0,0,.25);
          text-align:left; }
  #card .force { font-size:9.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:#fff;
                 display:inline-block; padding:2px 6px; border-radius:2px; text-align:left; }
  #card h2 { margin:7px 0 2px; font-size:14.5px; line-height:1.25; color:#1a1a1a; text-align:left; }
  #card .loc { font-size:11px; color:#666; margin:0 0 6px; font-weight:600; text-align:left; }
  #card #c-text { margin:0; font-size:12px; line-height:1.5; color:#333; text-align:left; }

  #legend { position:absolute; bottom:10px; right:10px; background:rgba(255,255,255,.94); border:1px solid #ccc;
            border-radius:3px; padding:7px 9px; z-index:600; font-size:10.5px; color:#333; line-height:1.55;
            text-align:left; }
  #legend b { display:block; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:#666; margin-bottom:3px; }
  #legend span.k { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle; }

  #ctrl { flex:0 0 auto; background:#2d2d2d; color:#fff; padding:8px 12px 10px; }
  .row { display:flex; align-items:center; gap:9px; }
  button { background:#4a4a4a; color:#fff; border:1px solid #6a6a6a; border-radius:3px; font-size:12px;
           padding:4px 10px; cursor:pointer; min-width:34px; }
  button:hover { background:#c8102e; border-color:#c8102e; }
  button:focus-visible { outline:2px solid #fff; outline-offset:1px; }
  input[type=range] { flex:1 1 auto; accent-color:#c8102e; height:20px; }
  #counter { font-size:11px; color:#b8b8b8; white-space:nowrap; min-width:96px; text-align:right; }
  #tick { font-size:11px; color:#e6e6e6; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  @media (max-width:640px){
    /* Anchor to the bottom of the map area. Must stay positioned, or z-index
       is ignored and the card renders beneath the Leaflet tiles. */
    #card { top:auto; bottom:0; left:0; right:0; width:auto; max-width:none;
            max-height:46%; overflow-y:auto;
            border:none; border-top:4px solid #c8102e; border-radius:0;
            box-shadow:0 -2px 8px rgba(0,0,0,.28); padding:9px 12px 11px; }
    #card h2 { font-size:13.5px; }
    /* Legend moves up top so it doesn't sit behind the card */
    #legend { top:10px; bottom:auto; right:10px; font-size:9.5px; padding:5px 7px; line-height:1.45; }
  }
</style>
</head>
<body>
<div id="wrap">

  <header>
    <img src="USNI_News_Logo.png" alt="USNI News">
    <div class="htxt">
      <p class="date">Week of September 25, 2026</p>
      <h1>Western Pacific Pulse</h1>
      <p>Naval and air activity across the Indo-Pacific</p>
    </div>
  </header>
  <div class="accent"></div>

  <div id="mapshell">
    <div id="map"></div>
    <div id="card">
      <span class="force" id="c-force"></span>
      <h2 id="c-title"></h2>
      <p class="loc" id="c-loc"></p>
      <p id="c-text"></p>
    </div>
    <div id="legend">
      <b>Forces</b>
      <div><span class="k" style="background:#dc2626"></span>PLA / China</div>
      <div><span class="k" style="background:#8b5cf6"></span>Russian Navy</div>
      <div><span class="k" style="background:#0891b2"></span>U.S. Navy</div>
      <div><span class="k" style="background:#f59e0b"></span>JMSDF / JASDF</div>
      <div><span class="k" style="background:#1e40af"></span>Royal Navy</div>
      <div><span class="k" style="background:#FF6B35"></span>DPRK</div>
      <div><span class="k" style="background:#16a34a"></span>Allied / partner navies</div>
      <div><span class="k" style="background:#84cc16"></span>Exercises &amp; training</div>
    </div>
  </div>

  <div id="ctrl">
    <div class="row">
      <button id="prev" aria-label="Previous incident">&#9664;</button>
      <button id="play" aria-label="Play sequence">&#9654;</button>
      <button id="next" aria-label="Next incident">&#9654;&#9654;</button>
      <input type="range" id="slider" min="0" max="0" value="0" step="1" aria-label="Step through incidents">
      <div id="counter"></div>
    </div>
    <div id="tick"></div>
  </div>

</div>

<script>
/* ---------- Week of September 25, 2026 ----------
   Each caption is the opening line or two of the filed editorial copy, unedited.
   Marker positions are the uploaded KML placemarks; track endpoints come from
   the bearings and distances given in the copy. */
const WEEK = "Week of September 25, 2026";

const incidents = [
  { force:"U.S. Navy", color:"#0891b2", lat:13.4291, lng:144.7536,
    vesselShort:"USS Abraham Lincoln (CVN-72), USS Frank E. Petersen Jr. (DDG-121)",
    location:"In U.S. 7th Fleet Area of Operations",
    text:`The Abraham Lincoln Carrier Strike Group (CSG) is underway following a two-day stop in Guam last weekend. The strike group includes aircraft carrier USS Abraham Lincoln (CVN-72) with embarked Carrier Air Wing (CVW) and destroyer USS Frank E. Petersen Jr. (DDG-121).` },

  { force:"U.S. Navy", color:"#0891b2", lat:19.4914, lng:132.5510,
    vesselShort:"USS Carl M Levin (DDG-120)",
    location:"In the Philippine Sea",
    text:`Destroyer USS Carl M Levin (DDG-120) is conducting routine operations in the Philippine Sea. Carl M Levin is forward-deployed and assigned to Destroyer Squadron (DESRON) 15.` },

  { force:"U.S. Navy", color:"#0891b2", lat:18.90, lng:131.85,
    vesselShort:"USS Benfold (DDG-65)",
    location:"In the Philippine Sea",
    text:`Destroyer USS Benfold (DDG-65) is operating in the Philippine Sea. Benfold, homeported in Everett, WA., is forward deployed and assigned to DESRON 15.` },

  { force:"Exercise / training", color:"#84cc16", lat:15.4881, lng:114.4048,
    vesselShort:"ADMM-Plus Maritime Security Joint Cooperative Activity",
    location:"In the South China Sea",
    text:`The Philippines and Japan are co-hosting the Association of Southeast Asian Nations (ASEAN) Defense Ministers' Meeting-Plus (ADMM-Plus) expert working group on Maritime Security Joint Cooperative Activity , which began Monday and ends on Saturday. The shore phase took place in Subic Bay, Zambales, while the sea phase began on Wednesday.` },

  { force:"PLA / China", color:"#dc2626", lat:15.1508, lng:118.5300,
    vesselShort:"People's Liberation Army Navy warship",
    location:"In the South China Sea",
    text:`Philippine media outlet ABS-CBN News reported Thursday that a People's Liberation Army Navy warship shadowed the task group as it approached the designated exercise box, which was around 45 nautical miles from Scarborough Shoal. China is a member of the ADMM-PLUS group but only attended the opening ceremony of the exercise.` },

  { force:"Allied / partner", color:"#16a34a", lat:14.70, lng:113.60,
    vesselShort:"HMNZS Te Mana (F111), HMNZS Aotearoa (A11), HMAS Sydney (DDG42)",
    location:"In the South China Sea",
    text:`While in the South China Sea en route to the Philippines, the Royal New Zealand Navy task group of Te Mana and Aotearoa conducted a duel replenishment at sea with Royal Australian Navy destroyer HMAS Sydney (DDG42).` },

  { force:"Exercise / training", color:"#84cc16", lat:-6.4058, lng:106.0640,
    vesselShort:"Exercise Trident Resolve",
    location:"In Banten, Indonesia",
    text:`Beginning on Monday, the ADMM-Plus Group conducted Exercise Trident in the province of Banten, Java, Indonesia. Trident Resolve is the first ADMM-Plus Combined Field Training Exercise involving three experts working groups on cyber security, Humanitarian Assistance and Disaster Relief and Military Medicine.` },

  { force:"Royal Navy", color:"#1e40af", lat:2.9999, lng:101.3928,
    vesselShort:"HMS Spey (P234)",
    location:"In Port Klang, Malaysia",
    text:`Royal Navy offshore patrol vessel HMS Spey (P234) docked into Port Klang Cruise Terminal, Malaysia on Tuesday for a port visit, as well as for engagements with the Malaysian Armed Forces. Spey will depart next week to participate with sister ship HMS Tamar (P233) in Five Power Defence Arrangement exercise Bersama Lima, which runs from Oct. 12-21 around the waters and airspace of Malaysia and Singapore.` },

  { force:"Allied / partner", color:"#16a34a", lat:13.1041, lng:100.9158,
    vesselShort:"ITS Giovanni delle Bande Nere (P434)",
    location:"In Laem Chabang, Thailand",
    text:`Italian Navy multi role combat ship ITS Giovanni delle Bande Nere (P434) docked into Laem Chabang Thailand on Tuesday for a port visit, which will conclude Saturday, according to an Italian Embassy news release. Giovanni delle Bande Nere is on home bound following an Indo-Pacific deployment that saw it take part in the Rim of the Pacific 2026 and Pacific Dragon 2026 exercises held over the summer around Hawaii.` },

  { force:"JMSDF / JASDF", color:"#f59e0b", lat:-0.2788, lng:111.4753,
    vesselShort:"JS Kunisaki (LST-4003)",
    location:"In West Kalimantan, Indonesia",
    text:`JMSDF amphibious tank landing ship JS Kunisaki (LST-4003) and one Japan Ground Self-Defense Force CH-47 helicopter are supporting Indonesia in carrying out firefighting and relief operations against the ongoing wildfire in the province of Ketapang. Two other JGSDF helicopters that were embarked on Kunisaki remain at Kijing Port to conduct firefighting operations in the area around the port.` },

  { force:"DPRK", color:"#FF6B35", lat:39.1539, lng:127.4460,
    vesselShort:"Hypersonic missile test launches",
    location:"In Wonsan, North Korea",
    text:`North Korea conducted hypersonic missile test launches on Sunday with North Korean leader Kim Jong Un overseeing the tests. Two missiles were launched towards the Sea of Japan with the first at 3 p.m. local time and the second at 5.50 p.m. local time.` },

  { force:"U.S. Navy", color:"#0891b2", lat:35.2815, lng:139.6722,
    vesselShort:"USS Scranton (SSN-756)",
    location:"In Yokosuka, Japan",
    text:`Fast attack submarine USS Scranton (SSN-756) departed Tuesday from Yokosuka, Japan, following a port visit, according to Japanese ship spotters.` },

  { force:"Exercise / training", color:"#84cc16", lat:43.2203, lng:142.8635,
    vesselShort:"Exercise Orient Shield 26",
    location:"In Hokkaido, Japan",
    text:`The U.S. Army, JGSDF and Australian Army concluded exercise Orient Shield 26 on Thursday with a closing ceremony at Camp Higashi-Chitose, Hokkaido, Japan. Orient Shield 26 featured several firsts for the exercise, including the integration of tactical operations centers to create a shared common operational picture at the tactical level, enhancing coordination and information sharing among participating forces, reads a U.S. Army news release.` },

  { force:"Russian Navy", color:"#8b5cf6", lat:45.8102, lng:141.9262,
    path:[[45.38,140.27],[45.8102,141.9262],[46.10,142.70]],
    vesselShort:"RFS Varyag (011), Marshal Krylov (331)",
    location:"In La P\u00e9rouse Strait",
    text:`At 5 a.m. on Wednesday, Russian Navy cruiser RFS Varyag (011) and missile range instrumentation ship Marshal Krylov (331) were sighted sailing northeast 60 kilometers \u2013 37 miles \u2013 west of Rebun Island and subsequently sailed east through La P\u00e9rouse Strait to enter the Sea of Okhotsk. JMSDF fast attack craft JS Kumataka (PG-827) shadowed the Russian ships.` },

  { force:"Russian Navy", color:"#8b5cf6", lat:38.8488, lng:135.0000,
    path:[[46.80,138.30],[43.35,140.30],[39.00,135.30],[35.90,133.70],[38.70,134.75],[43.20,140.05],[46.75,138.05]],
    vesselShort:"IL-20 Electronic Intelligence aircraft",
    location:"In the Sea of Japan",
    text:`On Friday, a Russian IL-20 Electronic Intelligence (IL-20) flew in from the Russian continent and over the Sea of Japan to the west coast of Hokkaido. The aircraft then flew off Tottori Prefecture on the main island of Honshu before turning back towards Russia.` },

  { force:"Allied / partner", color:"#16a34a", lat:-33.8623, lng:151.2077,
    vesselShort:"HMAS Supply (A195)",
    location:"In Sydney, Australia",
    text:`Fleet oiler HMAS Supply (A195) returned Wednesday to Fleet Base East, Sydney, Australia, following a 101-day deployment across the Indo-Pacific. During the deployment, it visited Singapore, Japan and the Philippines and worked alongside regional partners, including the U.S and Philippine navies.` }
];

/* ---------- Map ---------- */
const map = L.map('map', { zoomControl:true, scrollWheelZoom:true, worldCopyJump:false,
                           center:[15.0, 125.0], zoom:3 });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:12, attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

/* An incident may carry one track (path), several (paths), and extra
   secondary sites (also) that share its caption. */
incidents.forEach(inc => {
  inc._tracks = inc.paths ? inc.paths : (inc.path ? [inc.path] : []);
  inc._also = inc.also || [];
});

const pts = [];
incidents.forEach(inc => {
  if (inc.lng <= 180) pts.push([inc.lat, inc.lng]);
  inc._also.forEach(p => { if (p[1] <= 180) pts.push(p); });
  inc._tracks.forEach(t => t.forEach(p => { if (p[1] <= 180) pts.push(p); }));
});
const BOUNDS = L.latLngBounds(pts);

/* Fit only once the container actually has a size. A lazy-loaded, hidden or
   not-yet-laid-out iframe reports 0x0, and Leaflet then falls back to maxZoom,
   which opens the map fully zoomed in. Retry until a real size shows up. */
let fitted = false;
function fitAll(){
  const s = map.getSize();
  if (s.x < 60 || s.y < 60) return;
  map.invalidateSize(false);
  map.fitBounds(BOUNDS, { padding:[34,34] });
  fitted = true;
}
fitAll();
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(() => {
    if (!fitted) fitAll(); else map.invalidateSize(false);
  }).observe(document.getElementById('mapshell'));
}
window.addEventListener('load',   () => { if (!fitted) fitAll(); });
window.addEventListener('resize', () => { if (!fitted) fitAll(); else map.invalidateSize(false); });

incidents.forEach(inc => {
  inc._lines = inc._tracks.map(t => L.polyline(t, {
    color: inc.color, weight: 2, dashArray: '6,7', opacity: 0.12, interactive: false
  }).addTo(map));
});

incidents.forEach((inc, i) => {
  inc._sub = inc._also.map(p => L.circleMarker(p, {
    radius: 5, color: '#ffffff', weight: 1.5, fillColor: inc.color, fillOpacity: 0.18, opacity: 0.28
  }).addTo(map));
  inc._m = L.circleMarker([inc.lat, inc.lng], {
    radius: 7, color: '#ffffff', weight: 2, fillColor: inc.color, fillOpacity: 0.18, opacity: 0.28
  }).addTo(map);
  inc._m.on('click', () => setIndex(i));
});

/* ---------- Slider ---------- */
const slider  = document.getElementById('slider');
const counter = document.getElementById('counter');
const tick    = document.getElementById('tick');
const cardEl  = document.getElementById('card');
slider.max = incidents.length - 1;

let idx = 0, timer = null;

function setIndex(n) {
  idx = Math.max(0, Math.min(incidents.length - 1, n));
  slider.value = idx;

  incidents.forEach((inc, i) => {
    const shown   = i <= idx;
    const current = i === idx;
    inc._m.setStyle({
      fillOpacity: shown ? 0.95 : 0.18,
      opacity:     shown ? 1 : 0.28,
      weight:      current ? 3 : 2
    });
    inc._m.setRadius(current ? 11 : (shown ? 7.5 : 6));
    if (current) inc._m.bringToFront();
    inc._sub.forEach(s => s.setStyle({
      fillOpacity: shown ? 0.85 : 0.18, opacity: shown ? 0.95 : 0.28
    }));
    inc._lines.forEach(l => l.setStyle({ opacity: shown ? 0.75 : 0.12 }));
  });

  const inc = incidents[idx];
  const f = document.getElementById('c-force');
  f.textContent = inc.force;
  f.style.background = inc.color;
  document.getElementById('c-title').textContent = inc.vesselShort;
  document.getElementById('c-loc').textContent   = inc.location + ' \u00b7 ' + WEEK;
  document.getElementById('c-text').textContent  = inc.text;
  cardEl.scrollTop = 0;

  counter.textContent = (idx + 1) + ' of ' + incidents.length;
  tick.textContent = inc.location;
}

document.getElementById('prev').onclick = () => { stop(); setIndex(idx - 1); };
document.getElementById('next').onclick = () => { stop(); setIndex(idx + 1); };
slider.oninput = () => { stop(); setIndex(parseInt(slider.value, 10)); };

const playBtn = document.getElementById('play');
function stop() { if (timer) { clearInterval(timer); timer = null; playBtn.innerHTML = '&#9654;'; } }
playBtn.onclick = () => {
  if (timer) { stop(); return; }
  if (idx >= incidents.length - 1) setIndex(0);
  playBtn.innerHTML = '&#10074;&#10074;';
  timer = setInterval(() => {
    if (idx >= incidents.length - 1) { stop(); return; }
    setIndex(idx + 1);
  }, 3400);
};

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { stop(); setIndex(idx + 1); }
  if (e.key === 'ArrowLeft')  { stop(); setIndex(idx - 1); }
});

setIndex(0);
</script>
</body>
</html>
