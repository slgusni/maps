<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laoag City — Locator Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; font-family: Arial, sans-serif; background: #111; }
  #container { display: flex; flex-direction: column; width: 100%; height: 100vh; }
  #header {
    background: rgba(0,0,0,0.85); color: #f0e0c0;
    padding: 8px 14px; font-size: 14px; font-weight: bold;
    letter-spacing: 0.5px; border-bottom: 1px solid #444; flex-shrink: 0;
  }
  #header span { font-size: 11px; font-weight: normal; color: #aaa; margin-left: 10px; }
  #map { flex: 1; width: 100%; min-height: 0; }
  .leaflet-container { background: #1a2a3a; }

  /* Pulsing dot animation */
  @keyframes pulse {
    0%   { transform: scale(1);   opacity: 1; }
    50%  { transform: scale(2.5); opacity: 0; }
    100% { transform: scale(1);   opacity: 0; }
  }

  .pulse-container {
    position: relative;
    width: 16px;
    height: 16px;
  }

  .pulse-dot {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #ff3333;
    z-index: 2;
    box-shadow: 0 0 6px rgba(255,50,50,0.8);
  }

  .pulse-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #ff3333;
    animation: pulse 2s ease-out infinite;
    z-index: 1;
  }

  .leaflet-popup-content-wrapper {
    background: rgba(20,20,30,0.95); color: #eee;
    border: 1px solid #555; border-radius: 6px;
  }
  .leaflet-popup-tip { background: rgba(20,20,30,0.95); }
  .leaflet-popup-content { margin: 10px 14px; font-size: 12px; line-height: 1.6; }
  .popup-title { font-weight: bold; font-size: 13px; color: #f0e0c0; margin-bottom: 4px; }
</style>
</head>
<body>
<div id="container">
  <div id="header">
    📍 Laoag City
    <span>Ilocos Norte, Philippines</span>
  </div>
  <div id="map"></div>
</div>
<script>
const LAT = 18.1960;
const LNG = 120.5927;

const map = L.map('map', {
  center: [LAT, LNG],
  zoom: 8,
  zoomControl: true,
  attributionControl: true
});

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  crossOrigin: true
}).addTo(map);

// Pulsing marker
const pulseIcon = L.divIcon({
  className: '',
  html: `<div class="pulse-container">
    <div class="pulse-ring"></div>
    <div class="pulse-dot"></div>
  </div>`,
  iconAnchor: [8, 8]
});

const marker = L.marker([LAT, LNG], { icon: pulseIcon }).addTo(map);

// Label
L.marker([LAT, LNG], {
  icon: L.divIcon({
    className: '',
    html: `<div style="color:#fff;font-weight:bold;font-size:11px;white-space:nowrap;
           text-shadow:1px 1px 3px #000,-1px -1px 3px #000;
           padding-left:14px;margin-top:-7px">Laoag City</div>`,
    iconAnchor: [0, 0]
  }),
  interactive: false
}).addTo(map);

marker.bindPopup(`
  <div class="popup-title">Laoag City</div>
  <div>Ilocos Norte, Philippines</div>
  <div style="color:#888;font-size:10px;margin-top:4px">18.1960°N, 120.5927°E</div>
`, { maxWidth: 220 });

// USNI News logo
const logo = L.control({ position: 'bottomleft' });
logo.onAdd = () => {
  const d = L.DomUtil.create('div');
  d.style.cssText = 'padding:4px 6px;background:rgba(0,0,0,0.6);border-radius:4px;';
  d.innerHTML = '<img src="https://news.usni.org/wp-content/uploads/2016/02/usni_logo.png" style="height:28px;display:block;">';
  return d;
};
logo.addTo(map);
</script>
</body>
</html>
