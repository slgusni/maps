<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Western Pacific Pulse &mdash; Week of November 6, 2026</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  #wrap { display:flex; flex-direction:column; height:100vh; min-height:520px; }

  header { background:#2d2d2d; color:#fff; padding:8px 12px 6px; display:flex; align-items:center; gap:12px; flex:0 0 auto; }
  header img { height:26px; width:auto; display:block; }
  .htxt h1 { margin:0; font-size:15px; font-weight:700; letter-spacing:.02em; }
  .htxt .date { margin:0 0 2px; font-size:10px; font-weight:700; letter-spacing:.1em;
                text-transform:uppercase; color:#e8687d; }
  .htxt p  { margin:2px 0 0; font-size:11px; color:#b8b8b8; }
  .accent { height:4px; background:#c8102e; flex:0 0 auto; }

  #mapshell { position:relative; flex:1 1 auto; min-height:240px; }
  #map { position:absolute; inset:0; background:#dfe6ec; }

  /* Text block, left side of the map */
  #card { position:absolute; top:10px; left:10px; width:320px; max-width:calc(100% - 20px);
          max-height:calc(100% - 20px); overflow-y:auto; background:rgba(255,255,255,.96);
          border:1px solid #ccc; border-left:4px solid #c8102e; border-radius:3px;
          padding:10px 12px; z-index:600; box-shadow:0 1px 6px rgba(0,0,0,.25);
          text-align:left; }
  #card .force { font-size:9.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:#fff;
                 display:inline-block; padding:2px 6px; border-radius:2px; text-align:left; }
  #card h2 { margin:7px 0 2px; font-size:14.5px; line-height:1.25; color:#1a1a1a; text-align:left; }
  #card .loc { font-size:11px; color:#666; margin:0 0 6px; font-weight:600; text-align:left; }
  #card #c-text { margin:0; font-size:12px; line-height:1.5; color:#333; text-align:left; }

  #legend { position:absolute; bottom:10px; right:10px; background:rgba(255,255,255,.94); border:1px solid #ccc;
            border-radius:3px; padding:7px 9px; z-index:600; font-size:10.5px; color:#333; line-height:1.55;
            text-align:left; }
  #legend b { display:block; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:#666; margin-bottom:3px; }
  #legend span.k { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle; }

  #ctrl { flex:0 0 auto; background:#2d2d2d; color:#fff; padding:8px 12px 10px; }
  .row { display:flex; align-items:center; gap:9px; }
  button { background:#4a4a4a; color:#fff; border:1px solid #6a6a6a; border-radius:3px; font-size:12px;
           padding:4px 10px; cursor:pointer; min-width:34px; }
  button:hover { background:#c8102e; border-color:#c8102e; }
  button:focus-visible { outline:2px solid #fff; outline-offset:1px; }
  input[type=range] { flex:1 1 auto; accent-color:#c8102e; height:20px; }
  #counter { font-size:11px; color:#b8b8b8; white-space:nowrap; min-width:96px; text-align:right; }
  #tick { font-size:11px; color:#e6e6e6; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  @media (max-width:640px){
    /* Anchor to the bottom of the map area. Must stay positioned, or z-index
       is ignored and the card renders beneath the Leaflet tiles. */
    #card { top:auto; bottom:0; left:0; right:0; width:auto; max-width:none;
            max-height:46%; overflow-y:auto;
            border:none; border-top:4px solid #c8102e; border-radius:0;
            box-shadow:0 -2px 8px rgba(0,0,0,.28); padding:9px 12px 11px; }
    #card h2 { font-size:13.5px; }
    /* Legend moves up top so it doesn't sit behind the card */
    #legend { top:10px; bottom:auto; right:10px; font-size:9.5px; padding:5px 7px; line-height:1.45; }
    /* Card covers the bottom of the map here, so the zoom control goes back up */
    .leaflet-bottom.leaflet-left { bottom:auto; top:0; }
  }
</style>
</head>
<body>
<div id="wrap">

  <header>
    <img src="USNI_News_Logo.png" alt="USNI News">
    <div class="htxt">
      <p class="date">Week of November 6, 2026</p>
      <h1>Western Pacific Pulse</h1>
      <p>Naval and air activity across the Indo-Pacific</p>
    </div>
  </header>
  <div class="accent"></div>

  <div id="mapshell">
    <div id="map"></div>
    <div id="card">
      <span class="force" id="c-force"></span>
      <h2 id="c-title"></h2>
      <p class="loc" id="c-loc"></p>
      <p id="c-text"></p>
    </div>
    <div id="legend">
      <b>Forces</b>
      <div><span class="k" style="background:#dc2626"></span>PLA / China</div>
      <div><span class="k" style="background:#8b5cf6"></span>Russian Navy</div>
      <div><span class="k" style="background:#0891b2"></span>U.S. Navy</div>
      <div><span class="k" style="background:#1e40af"></span>Royal Navy</div>
      <div><span class="k" style="background:#FF6B35"></span>DPRK</div>
      <div><span class="k" style="background:#16a34a"></span>Allied / partner navies</div>
      <div><span class="k" style="background:#84cc16"></span>Exercises &amp; training</div>
    </div>
  </div>

  <div id="ctrl">
    <div class="row">
      <button id="prev" aria-label="Previous incident">&#9664;</button>
      <button id="play" aria-label="Play sequence">&#9654;</button>
      <button id="next" aria-label="Next incident">&#9654;&#9654;</button>
      <input type="range" id="slider" min="0" max="0" value="0" step="1" aria-label="Step through incidents">
      <div id="counter"></div>
    </div>
    <div id="tick"></div>
  </div>

</div>

<script>
/* ---------- Week of November 6, 2026 ----------
   Each caption is the opening line or two of the filed editorial copy, unedited.
   Ship positions come from the bearings and distances in the copy and the
   Joint Staff releases; air tracks are measured off the Joint Staff charts. */
const WEEK = "Week of November 6, 2026";

const incidents = [
  { force:"U.S. Navy", color:"#0891b2", lat:1.3200, lng:103.9867,
    /* Changi Naval Base; Sembawang, where Decatur docked, as a second site */
    also:[[1.4600,103.8200]],
    vesselShort:"Theodore Roosevelt Carrier Strike Group",
    location:"In Singapore",
    text:`The Theodore Roosevelt Carrier Strike Group pulled into Singapore on Friday for a port visit. The strike group includes aircraft carrier USS Theodore Roosevelt (CVN-71) with embarked carrier air wing (CVW) 11, cruiser USS Chosin (CG-65) and destroyers USS Paul Hamilton (DDG-60) and USS Decatur (DDG-73).` },

  { force:"U.S. Navy", color:"#0891b2", lat:16.2000, lng:115.2000,
    vesselShort:"USNS Tippecanoe (T-AO-199), JS Onami (DD-111)",
    location:"In the Philippine and South China seas",
    text:`Last weekend, the Theodore Roosevelt CSG with fleet oiler USNS Tippecanoe (T-AO-199) carried out cross deck and communication exercises with Japan Maritime Self-Defense Force (JMSDF) destroyer JS Onami (DD-111) in the Philippine Sea and South China Sea.` },

  { force:"Allied / partner", color:"#16a34a", lat:15.4881, lng:114.4048,
    vesselShort:"HMAS Stalwart (A304)",
    location:"In the South China Sea",
    text:`Royal Australian Navy fleet oiler HMAS Stalwart (A304) is operating in the South China Sea for the Royal Australian Navy's regional presence deployment. On Wednesday, aircraft carrier Theodore Roosevelt conducted a replenishment at sea with Stalwart.` },

  { force:"PLA / China", color:"#dc2626", lat:19.4914, lng:132.5510,
    vesselShort:"CNS Liaoning (16), CNS Anshan (101), CNS Wuxi (104), CNS Huainan (123)",
    location:"In the Philippine Sea",
    text:`The Liaoning Carrier Strike Group was operating in the Philippine Sea northeast of Luzon as of Wednesday, according to a graphic posted by Joseph Wu, Secretary General of Taiwan's National Security Council. The PLAN Liaoning CSG includes aircraft carrier CNS Liaoning (16) cruisers CNS Anshan (101) and CNS Wuxi (104) and destroyer CNS Huainan (123).` },

  { force:"Exercise / training", color:"#84cc16", lat:35.2815, lng:139.6722,
    vesselShort:"Quad Exercise Malabar 2026",
    location:"In Yokosuka, Japan",
    text:`The U.S., Japan, Australia and India opened Quad Exercise Malabar 2026 on Thursday with participating ships currently docked in the port for the shore phase of the exercise. The JMSDF is participating with helicopter destroyer JS Ise (DDH-182), frigate JS Mogami (FFM-1), a submarine and a P-1 Maritime Patrol Aircraft for the drills.` },

  { force:"U.S. Navy", color:"#0891b2", lat:35.2660, lng:139.7050,
    vesselShort:"USS Makin Island (LHD-8), USS Anchorage (LPD-23), USS John P. Murtha (LPD-26)",
    location:"In Yokosuka, Japan",
    text:`Anchorage and USS John P. Murtha with amphibious assault ship USS Makin Island (LHD-8) and the embarked 13th Marine Expeditionary Unit form the Makin Island Amphibious Ready Group, which has been docked in Yokosuka for a port visit since Oct. 26.` },

  { force:"U.S. Navy", color:"#0891b2", lat:35.2980, lng:139.6450,
    vesselShort:"USS Ralph Johnson (DDG-114)",
    location:"In Yokosuka, Japan",
    text:`Destroyer USS Ralph Johnson (DDG-114) returned to its homeport of Commander Fleet Activities Yokosuka (CFAY) on Tuesday, according to local ship spotters.` },

  { force:"DPRK", color:"#FF6B35", lat:39.7428, lng:127.4586,
    vesselShort:"Surface-to-air missile test and cruise missile firepower demonstration",
    location:"In North Korea",
    text:`North Korea test fired a newly-designed advanced air defense surface-to-air missile and carried out a firepower demonstration exercise with cruise missiles striking a mock airfield target on Wednesday, KCNA reported. South Korea's Joint Chiefs of Staff said that North Korea fired multiple missiles into the Sea of Japan from the Sondok area.` },

  { force:"Exercise / training", color:"#84cc16", lat:35.9078, lng:127.7669,
    vesselShort:"ROKN Task Fleet Command maritime drills",
    location:"Near South Korea",
    text:`The Republic of Korea Navy Task Fleet Command conducted fleet-level maritime drills in South Korea's East, West and South Seas from Sunday to Friday to strengthen the command's operational capabilities and readiness. The drills include air defense, anti-submarine warfare, anti-surface warfare and the detection and tracking of ballistic missiles with 10 ROKN ships, including destroyers ROKS Yulgok Yi I (DDG-992) and ROKS Jeongjo the Great (DDG-995) and ROKN and Republic of Korea Air Force aircraft.` },

  { force:"Allied / partner", color:"#16a34a", lat:35.1510, lng:128.6609,
    vesselShort:"ROKS Marado (LPH-6112), ROKS Ilchulbong (LST-688), ROKS Nojeokbong (LST-689)",
    location:"At Jinhae Naval Base, South Korea",
    text:`The Republic of Korea Navy Joint Cruise Training Task Force departed Tuesday from Jinhae for a cruise training voyage that will last until Nov. 20 and include port visits to Jeju, South Korea and Guam.` },

  { force:"Exercise / training", color:"#84cc16", lat:36.0178, lng:129.3609,
    vesselShort:"ROKMC 1st Marine Division counter-terrorism exercise",
    location:"In Pohang, South Korea",
    text:`The Republic of Korea Marine Corps 1st Marine Division participated in a counter-terrorism and aircraft incident response exercise held at Pohang-Gyeongju Airport on Wednesday. This year's exercise involved 15 organizations, including the 1st Marine Division's counter-terrorism unit, the Korea Airports Corporation, various airlines and local police, fire and medical agencies.` },

  { force:"Allied / partner", color:"#16a34a", lat:34.2489, lng:132.5655,
    vesselShort:"HMCS Regina (FFH334)",
    location:"In Kure, Japan",
    text:`Royal Canadian Navy frigate HMCS Regina (FFH334) arrived Sunday at Kure Naval Base for a port visit. Regina is on deployment under Operation Horizon, the Canadian Armed Forces' ongoing presence and engagement deployment to the Indo-Pacific.` },

  { force:"PLA / China", color:"#dc2626", lat:28.8600, lng:130.0500,
    vesselShort:"CNS Jingzhou (532)",
    location:"Near Amami Oshima",
    text:`PLAN frigate CNS Jingzhou (532) was sighted Saturday sailing northwest 80 kilometers \u2013 50 miles \u2013 northeast of the island of Amami Oshima. The frigate subsequently sailed southwest between Amami Oshima and Yokoate Island to enter the East China Sea.` },

  { force:"Russian Navy", color:"#8b5cf6", lat:26.6600, lng:126.4100,
    vesselShort:"Kareliya (535)",
    location:"In Miyako Strait",
    text:`Russian Navy surveillance ship Kareliya (535) sailed south between Miyako Island and Okinawa to enter the Philippine Sea on Saturday. The surveillance ship was previously sighted south 50 kilometers \u2013 31 miles \u2013 northwest of Kume Island in the East China Sea and subsequently was observed maneuvering northwest and west of Kume Island.` },

  { force:"PLA / China", color:"#dc2626", lat:23.4600, lng:126.7400,
    vesselShort:"CNS Qiqihar (121), CNS Hulunhu (901)",
    location:"In Miyako Strait",
    text:`On Sunday, PLAN destroyer CNS Qiqihar (121) and fast combat support ship CNS Hulunhu (901) were sighted sailing northwest 210 kilometers \u2013 130 miles \u2013 southeast of Miyako Island and subsequently sailed northwest through the waters between Okinawa and Miyako Island to enter the East China Sea.` },

  { force:"PLA / China", color:"#dc2626", lat:25.8900, lng:126.2500,
    vesselShort:"CNS Qiqihar (121), CNS Chaohu (890)",
    location:"In Miyako Strait",
    text:`On Monday, Qiqihar and fleet oiler CNS Chaohu (890) were sighted moving southeast 70 kilometers \u2013 43 miles \u2013 southwest of Kume Island. Subsequently, the two PLAN ships sailed southeast between Okinawa and Miyako Island to enter the Philippine Sea.` },

  { force:"PLA / China", color:"#dc2626", lat:25.6300, lng:126.1900,
    vesselShort:"CNS Qiqihar (121)",
    location:"In Miyako Strait",
    text:`Qiqihar returned Wednesday to the East China Sea, having sailed northwest between Miyako Island and Okinawa. The ship was previously sighted sailing north 130 kilometers \u2013 81 miles \u2013 northeast of Miyako Island.` },

  { force:"PLA / China", color:"#dc2626", lat:23.4500, lng:127.3500,
    path:[[28.10,123.95],[23.45,127.35],[23.35,126.20],[23.35,128.05],[24.90,128.15],[24.90,128.40],[23.42,128.40],[23.55,126.30],[28.05,124.05]],
    vesselShort:"WZ-7 reconnaissance UAV",
    location:"In Miyako Strait",
    text:`On Monday, a Chinese WZ-7 reconnaissance Unmanned Aerial Vehicle (UAV) flew in from the East China Sea, passing between Okinawa and Miyako Island, to enter the Philippine Sea. The drone carried out circuit flights in the Philippine Sea waters south of Miyako Island to south of Okinawa.` },

  { force:"PLA / China", color:"#dc2626", lat:24.5000, lng:125.7300,
    path:[[28.05,123.90],[23.10,126.45],[22.85,126.15],[24.50,128.20],[24.60,127.95],[22.95,126.05],[23.20,126.55],[28.00,123.98]],
    vesselShort:"Second WZ-7 reconnaissance UAV",
    location:"In Miyako Strait",
    text:`A second WZ-7 also flew in from the East China Sea on Monday and flew between Okinawa and Miyako Island to enter the Philippine Sea. The drone carried out circuit flights before returning back the same way to the East China Sea.` },

  { force:"PLA / China", color:"#dc2626", lat:24.4350, lng:122.4274,
    path:[[26.91,122.60],[24.38,122.50],[22.02,122.22]],
    vesselShort:"Suspected Chinese UAV",
    location:"Near Yonaguni Island and Taiwan",
    text:`On Saturday, a suspected Chinese UAV flew in from the East China Sea and passed between Yonaguni Island and Taiwan to enter the Philippine Sea. Fighter aircraft from the JASDF Southwestern Air Defense Command were scrambled in response.` },

  { force:"PLA / China", color:"#dc2626", lat:30.4000, lng:126.9000,
    path:[[31.50,124.80],[31.50,126.90],[28.80,126.90],[27.50,126.30],[27.50,124.42],[27.45,124.35],[29.13,124.35]],
    vesselShort:"TB-001 reconnaissance UAV",
    location:"In the East China Sea",
    text:`On Thursday, a Chinese TB-001 reconnaissance UAV flew from China over the East China Sea as far as southwest of the Danjo Islands. The drone subsequently changed course while northwest of Okinawa, and then returned to China.` },

  { force:"Russian Navy", color:"#8b5cf6", lat:45.8102, lng:141.9262,
    vesselShort:"RFS Varyag (011)",
    location:"In La P\u00e9rouse Strait",
    text:`Russian Navy cruiser RFS Varyag (011), flagship of the Russian Navy Pacific Fleet, sailed west through La P\u00e9rouse Strait, which separates Japan's main island of Hokkaido from Russia's Sakhalin Island, to enter the Sea of Japan on Thursday. The cruiser was previously sighted sailing west 40 kilometers \u2013 25 miles \u2013 north of Cape Soya, Hokkaido.` },

  { force:"Royal Navy", color:"#1e40af", lat:-12.4637, lng:130.8444,
    vesselShort:"HMS Tamar (P233)",
    location:"In Darwin, Australia",
    text:`Royal Navy offshore patrol vessel HMS Tamar (P233) docked Monday at Royal Australian Navy naval base HMAS Coonawarra, Northern Territory to carry out a crew change. Tamar with sister ship HMS Spey (P234) are forward deployed in the Indo-Pacific.` }
];

/* ---------- Map ---------- */
const map = L.map('map', { zoomControl:false, scrollWheelZoom:true, worldCopyJump:false,
                           center:[20.0, 128.0], zoom:3 });
L.control.zoom({ position:'bottomleft' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:12, attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

/* An incident may carry one track (path), several (paths), and extra
   secondary sites (also) that share its caption. */
incidents.forEach(inc => {
  inc._tracks = inc.paths ? inc.paths : (inc.path ? [inc.path] : []);
  inc._also = inc.also || [];
});

const pts = [];
incidents.forEach(inc => {
  if (inc.lng <= 180) pts.push([inc.lat, inc.lng]);
  inc._also.forEach(p => { if (p[1] <= 180) pts.push(p); });
  inc._tracks.forEach(t => t.forEach(p => { if (p[1] <= 180) pts.push(p); }));
});
const BOUNDS = L.latLngBounds(pts);

/* Fit only once the container actually has a size. A lazy-loaded, hidden or
   not-yet-laid-out iframe reports 0x0, and Leaflet then falls back to maxZoom,
   which opens the map fully zoomed in. Retry until a real size shows up. */
let fitted = false;
function fitAll(){
  const s = map.getSize();
  if (s.x < 60 || s.y < 60) return;
  map.invalidateSize(false);
  map.fitBounds(BOUNDS, { padding:[34,34] });
  fitted = true;
}
fitAll();
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(() => {
    if (!fitted) fitAll(); else map.invalidateSize(false);
  }).observe(document.getElementById('mapshell'));
}
window.addEventListener('load',   () => { if (!fitted) fitAll(); });
window.addEventListener('resize', () => { if (!fitted) fitAll(); else map.invalidateSize(false); });

incidents.forEach(inc => {
  inc._lines = inc._tracks.map(t => L.polyline(t, {
    color: inc.color, weight: 2, dashArray: '6,7', opacity: 0.12, interactive: false
  }).addTo(map));
});

incidents.forEach((inc, i) => {
  inc._sub = inc._also.map(p => L.circleMarker(p, {
    radius: 5, color: '#ffffff', weight: 1.5, fillColor: inc.color, fillOpacity: 0.18, opacity: 0.28
  }).addTo(map));
  inc._m = L.circleMarker([inc.lat, inc.lng], {
    radius: 7, color: '#ffffff', weight: 2, fillColor: inc.color, fillOpacity: 0.18, opacity: 0.28
  }).addTo(map);
  inc._m.on('click', () => setIndex(i));
});

/* ---------- Slider ---------- */
const slider  = document.getElementById('slider');
const counter = document.getElementById('counter');
const tick    = document.getElementById('tick');
const cardEl  = document.getElementById('card');
slider.max = incidents.length - 1;

let idx = 0, timer = null;

function setIndex(n) {
  idx = Math.max(0, Math.min(incidents.length - 1, n));
  slider.value = idx;

  incidents.forEach((inc, i) => {
    const shown   = i <= idx;
    const current = i === idx;
    inc._m.setStyle({
      fillOpacity: shown ? 0.95 : 0.18,
      opacity:     shown ? 1 : 0.28,
      weight:      current ? 3 : 2
    });
    inc._m.setRadius(current ? 11 : (shown ? 7.5 : 6));
    if (current) inc._m.bringToFront();
    inc._sub.forEach(s => s.setStyle({
      fillOpacity: shown ? 0.85 : 0.18, opacity: shown ? 0.95 : 0.28
    }));
    inc._lines.forEach(l => l.setStyle({ opacity: shown ? 0.75 : 0.12 }));
  });

  const inc = incidents[idx];
  const f = document.getElementById('c-force');
  f.textContent = inc.force;
  f.style.background = inc.color;
  document.getElementById('c-title').textContent = inc.vesselShort;
  document.getElementById('c-loc').textContent   = inc.location + ' \u00b7 ' + WEEK;
  document.getElementById('c-text').textContent  = inc.text;
  cardEl.scrollTop = 0;

  counter.textContent = (idx + 1) + ' of ' + incidents.length;
  tick.textContent = inc.location;
}

document.getElementById('prev').onclick = () => { stop(); setIndex(idx - 1); };
document.getElementById('next').onclick = () => { stop(); setIndex(idx + 1); };
slider.oninput = () => { stop(); setIndex(parseInt(slider.value, 10)); };

const playBtn = document.getElementById('play');
function stop() { if (timer) { clearInterval(timer); timer = null; playBtn.innerHTML = '&#9654;'; } }
playBtn.onclick = () => {
  if (timer) { stop(); return; }
  if (idx >= incidents.length - 1) setIndex(0);
  playBtn.innerHTML = '&#10074;&#10074;';
  timer = setInterval(() => {
    if (idx >= incidents.length - 1) { stop(); return; }
    setIndex(idx + 1);
  }, 3400);
};

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { stop(); setIndex(idx + 1); }
  if (e.key === 'ArrowLeft')  { stop(); setIndex(idx - 1); }
});

setIndex(0);
</script>
</body>
</html>
