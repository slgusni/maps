<html>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>

  align-items: center;
  padding: 12px 20px;
}
.header-logo {

}
.header-logo img {
  height: 40px;
  background: white;

}
.header-title {

}
.red-bar {

}

#controls {

}
.incident-slider {
  width: 100%;

  -webkit-appearance: none;
  appearance: none;
  background: linear-gradient(to right, #4A90E2 0%, #4A90E2 var(--progress), #ddd var(--progress), #ddd 100%);
  outline: none;
  border-radius: 4px;
}
.incident-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 24px;
  height: 24px;
  background: #4A90E2;
  cursor: pointer;
  border-radius: 50%;
  border: 3px solid white;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}
.incident-slider::-moz-range-thumb {
  width: 24px;
  height: 24px;
  background: #4A90E2;
  cursor: pointer;
  border-radius: 50%;
  border: 3px solid white;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}
.current-date {

}
.source {

  bottom: 160px;
  right: 10px;
  background: white;
  padding: 5px 10px;
  border-radius: 4px;
  font-size: 11px;
  color: #666;
  box-shadow: 0 1px 5px rgba(0,0,0,0.2);
  z-index: 1000;
}
.legend {
  position: absolute;
  top: 70px;
  right: 10px;
  background: white;
  padding: 12px;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  z-index: 1000;
  font-size: 12px;
  max-width: 220px;
}
.legend-item {
  display: flex;
  align-items: center;
  margin: 6px 0;
}
.legend-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  margin-right: 8px;
  flex-shrink: 0;
  border: 2px solid rgba(0,0,0,0.3);
}
.nav-buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 15px;
}
.nav-btn {
  padding: 8px 20px;
  border: none;
  background: #4A90E2;
  color: white;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 500;
}
.nav-btn:hover { background: #357ABD; }
.nav-btn:disabled { background: #ccc; cursor: not-allowed; }
</style>

<body>

<div id="map"></div>
<div class="source">Source: JSDF / USNI News</div>
<div class="legend">

  <div class="legend-item"><div class="legend-dot" style="background: #64748b;"></div><span>International</span></div>
  <div class="legend-item"><div class="legend-dot" style="background: #84cc16;"></div><span>Exercise</span></div>
</div>
<div id="controls">

    <div style="font-size: 14px; color: #666; margin-top: 4px;"></div>
  </div>
  <input type="range" id="incidentSlider" class="incident-slider" min="0" max="16" value="0" step="1">
  <div class="nav-buttons">
    <button class="nav-btn" id="prevBtn" onclick="previousIncident()">← Previous</button>
    <button class="nav-btn" id="nextBtn" onclick="nextIncident()">Next →</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

  {

];

let currentIncidentIndex = 0;
let markers = [];

const slider = document.getElementById('incidentSlider');
slider.addEventListener('input', (e) => {
  displayIncident(parseInt(e.target.value));
});

function updateSliderProgress() {
  const progress = (currentIncidentIndex / (incidents.length - 1)) * 100;
  slider.style.setProperty('--progress', `${progress}%`);
}

function displayIncident(incidentIndex) {
  currentIncidentIndex = incidentIndex;
  slider.value = incidentIndex;
  updateSliderProgress();

  markers.forEach(marker => map.removeLayer(marker));
  markers = [];

  const currentIncident = incidents[incidentIndex];

  document.getElementById('currentDate').innerHTML = `
    <div style="font-size: 20px; font-weight: 600;">${currentIncident.fullDate}</div>
    <div style="font-size: 14px; color: #666; margin-top: 4px;">${currentIncident.vesselShort} — ${currentIncident.location}</div>
  `;

  incidents.forEach((incident, i) => {
    const isFuture = i > incidentIndex;
    const isCurrent = i === incidentIndex;

    const marker = L.circleMarker([incident.lat, incident.lon], {
      radius: isCurrent ? 10 : 6,
      fillColor: incident.color,
      color: isFuture ? 'rgba(0,0,0,0.1)' : 'rgba(0,0,0,0.4)',
      weight: 2,
      opacity: isFuture ? 0.3 : 1,
      fillOpacity: isFuture ? 0.2 : (isCurrent ? 0.9 : 0.6)
    }).bindPopup(`
      <strong>${incident.vesselShort}</strong><br>
      ${incident.location}<br>
      ${incident.direction}<br>
      <em>${incident.fullDate}</em>
    `);

    marker.addTo(map);
    markers.push(marker);
  });

  drawPaths(incidentIndex);

  document.getElementById('prevBtn').disabled = incidentIndex === 0;
  document.getElementById('nextBtn').disabled = incidentIndex === incidents.length - 1;
}

function drawPaths(upToIndex) {
  const vesselPaths = {};
  for (let i = 0; i <= upToIndex; i++) {
    const incident = incidents[i];
    if (!vesselPaths[incident.vessel]) vesselPaths[incident.vessel] = [];
    vesselPaths[incident.vessel].push({ lat: incident.lat, lon: incident.lon, color: incident.color });
  }
  Object.keys(vesselPaths).forEach(vessel => {
    const points = vesselPaths[vessel];
    if (points.length > 1) {
      const path = L.polyline(points.map(p => [p.lat, p.lon]), {
        color: points[0].color,
        weight: 2,
        opacity: 0.4,
        dashArray: '5, 10'
      });
      path.addTo(map);
      markers.push(path);
    }
  });
}

function previousIncident() {
  if (currentIncidentIndex > 0) displayIncident(currentIncidentIndex - 1);
}

function nextIncident() {
  if (currentIncidentIndex < incidents.length - 1) displayIncident(currentIncidentIndex + 1);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') previousIncident();
  if (e.key === 'ArrowRight') nextIncident();
});

function fitMapToIncidents() {
  const bounds = L.latLngBounds(incidents.map(inc => [inc.lat, inc.lon]));
  map.fitBounds(bounds, { padding: [50, 50] });
}

fitMapToIncidents();
displayIncident(0);
</script>
</body>
</html>
