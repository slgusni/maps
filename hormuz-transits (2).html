<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strait of Hormuz weekly transits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  --water:#FCFDFD; --land:#DFE2E5; --coast:#4C5258;
  --ink:#22262A; --ink-soft:#666D75;
  --magenta:#B4156F; --wb:#0F4560; --eb:#9A4520;
  --rule:#C6CBD0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--water);color:var(--ink);
  font-family:"IBM Plex Sans Condensed",system-ui,sans-serif}
.wrap{width:100%;max-width:1100px;margin:0 auto}
.head{display:flex;align-items:center;padding:0 0 11px;margin:0 0 12px;
  border-bottom:.5px solid var(--rule)}
.head .logo{display:block;width:152px;height:auto}
.stage{position:relative}
svg{display:block;width:100%;height:auto;background:var(--water)}
.land{fill:var(--land);stroke:var(--coast);stroke-width:.8;stroke-linejoin:round}
.gl{stroke:var(--rule);stroke-width:.5;fill:none}
.gt{fill:var(--ink-soft);font-size:10px;letter-spacing:.04em}
.pl{fill:var(--ink);font-size:12.5px;font-weight:500}
.sea{fill:var(--ink-soft);font-family:"IBM Plex Serif",serif;font-style:italic;font-size:14px}
.ctry{fill:var(--ink-soft);font-size:15px;font-weight:600;letter-spacing:.18em}
.dot{fill:var(--ink)}
.lead{stroke:var(--ink-soft);stroke-width:.6;fill:none;opacity:.7}
.corrlab{fill:var(--magenta);font-size:11.5px;font-weight:500}
.lane{fill:none;stroke-width:1;opacity:.4;stroke-dasharray:3 4}
.hull{stroke:none}
.house{fill:#FCFDFD;opacity:.85}
.note2{fill:var(--ink-soft);font-size:10.5px}
.block{position:absolute;left:18px;bottom:18px;width:292px;background:rgba(252,253,253,.95);
  border:.8px solid var(--coast);padding:14px 16px 12px}
.block h1{margin:0 0 2px;font-size:16px;font-weight:600;letter-spacing:.01em}
.block .wk{font-size:13px;color:var(--ink-soft);margin:0 0 10px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:3px 0;border-bottom:.5px solid var(--rule)}
.tbl td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:20px;height:9px;margin-right:7px;vertical-align:0}
.note{font-size:11px;color:var(--ink-soft);line-height:1.45;margin:9px 0 0}
.src{font-size:10.5px;color:var(--ink-soft);margin:7px 0 0;padding-top:7px;border-top:.5px solid var(--rule)}
.ctl{position:absolute;right:18px;top:18px;display:flex;border:.8px solid var(--coast)}
.ctl button{font-family:inherit;font-size:12.5px;padding:6px 12px;background:rgba(252,253,253,.95);
  border:0;border-left:.8px solid var(--coast);cursor:pointer;color:var(--ink-soft)}
.ctl button:first-child{border-left:0}
.ctl button[aria-pressed=true]{background:var(--ink);color:#FCFDFD;font-weight:500}
.ctl button:focus-visible{outline:2px solid var(--magenta);outline-offset:-2px}
@media (max-width:720px){
  .block{position:static;width:auto;border-left:0;border-right:0;border-bottom:0}
  .ctl{position:static;border-left:0;border-right:0;border-top:0}
  .ctl button{flex:1}
}
</style>
</head>

const EBL = [[26.1780,54.3020],[26.1780,54.9920],[26.2380,55.0520],[26.2380,55.2200],[26.2020,55.2800],[26.2020,55.7720],[26.2800,55.9220],[26.2800,56.0780],[26.4360,56.2400],[26.4360,56.4500],[26.4060,56.4800],[26.4000,56.5280],[26.3040,56.6240],[26.2680,56.7140],[25.7520,57.2360],[25.7280,57.2960],[25.6080,57.4340],[25.1940,57.8480],[25.1940,58.3400],[25.0980,58.5500]];
const CORR = [[26.2020,57.0500],[26.3160,56.9360],[26.3400,56.9360],[26.4780,56.7980],[26.5440,56.7680],[26.6580,56.6540],[26.7000,56.6540],[26.8560,56.5040],[26.8800,56.4380],[26.9100,56.4080],[26.9100,56.3660],[26.9280,56.3300],[26.8680,56.2100]];

const LON0 = 54.2, LAT1 = 27.3, KX = 0.8977774, SC = 242.148;
const px = (lon, lat) => [(lon - LON0) * KX * SC, (LAT1 - lat) * SC];
const path = pts => "M" + pts.map(p => px(p[1], p[0]).map(v => v.toFixed(1)).join(",")).join(" L");

const PLACES = [
  { n:"Bandar Abbas", lat:27.18, lon:56.28, dx:8,  dy:4 },
  { n:"Khasab",       lat:26.18, lon:56.24, dx:-8, dy:4, anchor:"end" },

];
const ISLES = [
  { n:"Qeshm",  lat:26.78, lon:55.80 },
  { n:"Larak",  lat:26.86, lon:56.36, dy:-12 },
  { n:"Hormuz", lat:27.06, lon:56.46, dy:-12 }
];

function grid() {
  let s = "";
  for (let lon = 55; lon <= 58; lon++) {
    const [x] = px(lon, 27.3);
    s += `<line class="gl" x1="${x.toFixed(1)}" y1="0" x2="${x.toFixed(1)}" y2="581"/>`
       + `<text class="gt" x="${(x+4).toFixed(1)}" y="575">${lon}°E</text>`;
  }
  for (let lat = 25; lat <= 27; lat++) {
    const [, y] = px(54.2, lat);
    s += `<line class="gl" x1="0" y1="${y.toFixed(1)}" x2="1000" y2="${y.toFixed(1)}"/>`
       + `<text class="gt" x="6" y="${(y-5).toFixed(1)}">${lat}°N</text>`;
  }
  return s;
}

function labels() {
  const ctry = (n, lat, lon) => {
    const [x, y] = px(lon, lat);
    return `<text class="ctry" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle">${n}</text>`;
  };
  let s = ctry("IRAN", 27.13, 54.48)
        + ctry("OMAN", 25.75, 56.22)
        + ctry("U.A.E.", 25.36, 55.37)
        + `<text class="sea" x="742" y="470">Gulf of Oman</text>`
        + `<text class="sea" x="86" y="238">Persian Gulf</text>`
        + `<text class="pl" x="${px(56.16,26.12)[0].toFixed(1)}" y="${px(56.16,26.12)[1].toFixed(1)}" text-anchor="middle" style="font-weight:400">Musandam</text>`;
  PLACES.forEach(p => {
    const [x, y] = px(p.lon, p.lat);
    s += `<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6"/>`
       + `<text class="pl" x="${(x+p.dx).toFixed(1)}" y="${(y+p.dy).toFixed(1)}"${p.anchor?' text-anchor="end"':''}>${p.n}</text>`;
  });
  ISLES.forEach(p => {
    const [x, y] = px(p.lon, p.lat);
    s += `<text class="pl" x="${x.toFixed(1)}" y="${(y+(p.dy||16)).toFixed(1)}" text-anchor="middle" style="font-weight:400">${p.n}</text>`;
  });
  return s;
}

const ENTRIES = [
  { lat: 26.80, lon: 56.54, colour: "var(--magenta)", label: "Iranian routes",
    llat: 26.70, llon: 56.54, anchor: "start" },
  { lat: 25.70, lon: 56.60, colour: "var(--wb)",      label: "Omani route",
    llat: 25.80, llon: 56.60, anchor: "start" }
];

function drawEntries(w) {
  const g = document.getElementById("routes");
  if (!w.entries) { g.innerHTML = ""; return; }
  g.innerHTML = ENTRIES.map(e => {
    const [x, y]   = px(e.lon, e.lat);
    const [lx, ly] = px(e.llon, e.llat);
    return `<path class="lead" d="M${x.toFixed(1)},${y.toFixed(1)} L${lx.toFixed(1)},${(ly-4).toFixed(1)}"/>`
         + `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="8" fill="none" stroke="var(--water)" stroke-width="2.6"/>`
         + `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6" fill="none" stroke="${e.colour}" stroke-width="2.2" stroke-dasharray="2.6 2.4"/>`
         + `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.8" fill="${e.colour}"/>`
         + `<text class="corrlab" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" `
         + `text-anchor="${e.anchor}" fill="${e.colour}">${e.label}</text>`;
  }).join("");
}

/* All frames are put on a common 7-day footing before anything is drawn,
   so periods of unequal length stay comparable. */
const perWeek = (n, days) => n == null ? null : Math.round(n * 7 / days);
const BASE = perWeek(DATA.weeks[0].total, DATA.weeks[0].days);

const SVGNS = "http://www.w3.org/2000/svg";
const lanesG = document.getElementById("lanes");
const shipsG = document.getElementById("ships");

/* Sample each lane once into a lookup table so the animation never
   calls getPointAtLength per frame. */
function sampleLane(pts, id, colour) {
  const p = document.createElementNS(SVGNS, "path");
  p.setAttribute("d", path(pts));
  p.setAttribute("class", "lane");
  p.setAttribute("stroke", colour);
  lanesG.appendChild(p);
  const len = p.getTotalLength(), N = 500, tbl = [];
  for (let i = 0; i <= N; i++) {
    const a = p.getPointAtLength(len * i / N);
    tbl.push([a.x, a.y]);
  }
  const ang = tbl.map((_, i) => {
    const a = tbl[Math.max(0, i - 2)], b = tbl[Math.min(N, i + 2)];
    return Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
  });
  return { tbl, ang, N, len, colour };
}

const LANES = {
  wb: sampleLane(WBL, "wb", "var(--wb)"),
  eb: sampleLane(EBL, "eb", "var(--eb)")
};

function ship(colour) {
  const g = document.createElementNS(SVGNS, "g");
  const h = document.createElementNS(SVGNS, "path");
  h.setAttribute("d", "M-5.6,-1.75 L2.4,-1.75 L5.6,0 L2.4,1.75 L-5.6,1.75 Z");
  h.setAttribute("class", "hull");
  h.setAttribute("fill", colour);
  const c = document.createElementNS(SVGNS, "rect");
  c.setAttribute("x", "-4.8"); c.setAttribute("y", "-1.1");
  c.setAttribute("width", "2"); c.setAttribute("height", "2.2");
  c.setAttribute("class", "house");
  g.append(h, c);
  return g;
}

let fleet = [], playing = true, t0 = null, reduced =
  window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const SPEED = 46;   // px per second along the lane

/* Deterministic per-vessel scatter: ships sail a lane, not a queue. */
const rnd = n => { let h = (n * 2654435761) >>> 0; h ^= h >>> 15; return ((h >>> 0) % 1000) / 1000; };

function place(s, u) {
  const L = LANES[s.lane], i = Math.round(u * L.N);
  const [x, y] = L.tbl[i], a = L.ang[i], rad = a * Math.PI / 180;
  const ox = -Math.sin(rad) * s.off, oy = Math.cos(rad) * s.off;
  s.el.setAttribute("transform",
    `translate(${(x+ox).toFixed(1)},${(y+oy).toFixed(1)}) rotate(${a.toFixed(1)})`);
}

function build(w) {
  shipsG.textContent = "";
  fleet = [];
  const mk = (lane, count, colour, seed) => {
    if (count == null) return;
    const n = Math.max(1, Math.round(count / DATA.perVessel));
    for (let i = 0; i < n; i++) {
      const el = ship(colour);
      shipsG.appendChild(el);
      const k = i + seed;
      const s = { el, lane, off: (rnd(k) - 0.5) * 11,
                  phase: (i + (rnd(k + 91) - 0.5) * 0.7) / n };
      fleet.push(s);
      place(s, s.phase);
    }
  };
  if (w.splitUnknown) {
    const half = perWeek(w.total, w.days) / 2;
    mk("wb", half, "var(--wb)", 0);
    mk("eb", half, "var(--eb)", 500);
  } else {
    mk("wb", perWeek(w.westbound, w.days), "var(--wb)", 0);
    mk("eb", perWeek(w.eastbound, w.days), "var(--eb)", 500);
  }
}

function frame(ts) {
  if (!playing) return;
  if (t0 === null) t0 = ts;
  const el = (ts - t0) / 1000;
  fleet.forEach(s => {
    const L = LANES[s.lane];
    place(s, (s.phase + el * SPEED / L.len) % 1);
  });
  requestAnimationFrame(frame);
}

function setPlaying(on) {
  playing = on && !reduced;
  const b = document.getElementById("pp");
  if (b) {
    b.textContent = playing ? "Pause" : "Play";
    b.setAttribute("aria-pressed", playing);
  }
  if (playing) { t0 = null; requestAnimationFrame(frame); }
}

function block(w) {
  const row = (sw, lab, val) =>
    `<tr><td>${sw ? `<span class="sw" style="background:${sw}"></span>` : ""}${lab}</td><td>${val}</td></tr>`;
  const num = n => n == null ? "not reported" : n.toLocaleString("en");
  const pw = perWeek(w.total, w.days);
  document.getElementById("wklab").textContent = w.label;

  let rows = "";
  if (w.splitUnknown) {
    rows = row("", `Transits, ${w.days} days`, num(w.total))
         + row("", "Weekly equivalent", num(pw));
  } else {
    rows = row("var(--wb)", "Westbound", num(w.westbound))
         + row("var(--eb)", "Eastbound", num(w.eastbound))
         + row("", "Total, 7 days", num(w.total));
  }
  rows += row("", "Share of pre-war", pw === BASE ? "baseline" : Math.round(pw / BASE * 100) + "%");
  document.getElementById("tb").innerHTML = rows;

  const unit = DATA.perVessel === 1
    ? "One silhouette is one transit. "
    : `One silhouette represents ${DATA.perVessel} transits per week. `;
  document.getElementById("note").textContent =
    unit + "Spacing and transit paths are illustrative. "
    + (w.entries ? "Omani and Iranian route locations are approximate. " : "")
    + (w.note || "");
  document.getElementById("src").textContent = DATA.source;
}

function render(i) {
  const w = DATA.weeks[i];
  drawEntries(w);
  build(w);
  block(w);
  [...document.querySelectorAll("#ctl button[data-wk]")].forEach((b, k) =>
    b.setAttribute("aria-pressed", k === i));
  if (playing) { t0 = null; }
}

document.getElementById("grid").innerHTML = grid();
document.getElementById("labels").innerHTML = labels();
document.getElementById("ctl").innerHTML =
  DATA.weeks.map((w, i) => `<button type="button" data-wk="${i}" onclick="render(${i})">${w.short || w.label}</button>`).join("")
  + `<button type="button" id="pp" onclick="setPlaying(!playing)">Pause</button>`;
render(DATA.weeks.length - 1);
setPlaying(!reduced);
</script>
</body>
</html>
