<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iranian Retaliation Strikes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; font-family: Arial, sans-serif; background: #111; }

  #container {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
  }

  #header {
    background: rgba(0,0,0,0.85);
    color: #f0e0c0;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 0.5px;
    border-bottom: 1px solid #444;
    flex-shrink: 0;
  }

  #header span {
    font-size: 11px;
    font-weight: normal;
    color: #aaa;
    margin-left: 10px;
  }

  #map {
    flex: 1;
    width: 100%;
    min-height: 0;
  }

  .leaflet-container { background: #1a2a3a; }

  .legend {
    background: rgba(0,0,0,0.75);
    padding: 8px 12px;
    border-radius: 6px;
    color: #ddd;
    font-size: 11px;
    line-height: 20px;
  }
  .legend-item { display: flex; align-items: center; gap: 7px; }
  .legend-dot {
    width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.4);
  }

  .leaflet-popup-content-wrapper {
    background: rgba(20,20,30,0.95);
    color: #eee;
    border: 1px solid #555;
    border-radius: 6px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }
  .leaflet-popup-tip { background: rgba(20,20,30,0.95); }
  .leaflet-popup-content { margin: 10px 14px; font-size: 12px; line-height: 1.6; }
  .popup-title { font-weight: bold; font-size: 13px; margin-bottom: 4px; }
  .popup-type-strike { color: #ff4444; }
  .popup-type-launch { color: #ff9900; }
  .popup-type-target { color: #ffdd00; }
</style>
</head>
<body>
<div id="container">
  <div id="header">
    🎯 Iranian Retaliation Strikes
    <span id="subtitle">Iranian Strikes Across the Middle East — Feb 28, 2026</span>
  </div>
  <div id="map"></div>
</div>

<script>
// =============================================================
//  ✏️  EDIT THIS SECTION TO ADD / UPDATE LOCATIONS
//
//  Types:
//    "strike"  — confirmed strike location  (red)
//    "launch"  — launch origin / fired from (orange)
//    "target"  — reported target / unconfirmed (yellow)
//
//  Fields:
//    lat, lng  — coordinates (decimal degrees)
//    name      — location name shown in popup
//    type      — "strike" | "launch" | "target"
//    detail    — optional extra info shown in popup
// =============================================================
const LOCATIONS = [
  // LAUNCH ORIGIN
  {
    lat: 35.6892, lng: 51.3890,
    name: "Iran",
    type: "launch",
    detail: "Origin of ballistic missile and drone strikes across the region"
  },

  // ISRAEL — Israeli strikes on Iranian launchers and air defense
  {
    lat: 31.7683, lng: 35.2137,
    name: "Israel",
    type: "strike",
    detail: "IDF and IAF conducted strikes on Iranian missile launchers and air defense systems. Src: @IDF, @iafsite"
  },

  // UAE — at least three waves of Iranian strikes
  {
    lat: 24.4539, lng: 54.3773,
    name: "Abu Dhabi, UAE",
    type: "strike",
    detail: "At least three waves of Iranian missile/drone attacks reported. Src: @modgovae"
  },

  // JORDAN — missile attack
  {
    lat: 31.9454, lng: 35.9284,
    name: "Amman, Jordan",
    type: "strike",
    detail: "Missile attack reported. Src: @foreignministry"
  },

  // KUWAIT — missile attack
  {
    lat: 29.3759, lng: 47.9774,
    name: "Kuwait City, Kuwait",
    type: "strike",
    detail: "Missile attack reported. Src: @KuwaitArmyGHQ, @MofaKuwait"
  },

  // BAHRAIN — ballistic missile and drone strike on NSA Base
  {
    lat: 26.2361, lng: 50.5860,
    name: "NSA Bahrain (Naval Support Activity)",
    type: "strike",
    detail: "Ballistic missile and drone strike on US Naval base. Src: @eslavin_stripes, @osinttechnical"
  },

  // QATAR — missile attacks
  {
    lat: 25.2854, lng: 51.5310,
    name: "Doha, Qatar",
    type: "strike",
    detail: "Missile attacks reported. Src: @MofaQatar_EN, @mod_qatar"
  }
];
// =============================================================
//  END OF EDITABLE SECTION
// =============================================================

const TYPE_CONFIG = {
  strike: { color: "#ff3333", label: "Confirmed Strike" },
  launch: { color: "#ff9900", label: "Launch Origin" },
  target: { color: "#ffdd00", label: "Reported Target" }
};

const lats = LOCATIONS.map(l => l.lat);
const lngs = LOCATIONS.map(l => l.lng);
const bounds = [[Math.min(...lats)-2, Math.min(...lngs)-2], [Math.max(...lats)+2, Math.max(...lngs)+2]];

const map = L.map('map', {
  zoomControl: true,
  attributionControl: true
}).fitBounds(bounds);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  crossOrigin: true
}).addTo(map);

LOCATIONS.forEach(loc => {
  const cfg = TYPE_CONFIG[loc.type] || TYPE_CONFIG.target;

  const marker = L.circleMarker([loc.lat, loc.lng], {
    radius: 9,
    color: cfg.color,
    fillColor: cfg.color,
    fillOpacity: 0.85,
    weight: 2
  }).addTo(map);

  if (loc.type === 'strike') {
    L.circleMarker([loc.lat, loc.lng], {
      radius: 16,
      color: cfg.color,
      fillOpacity: 0,
      weight: 1,
      opacity: 0.4
    }).addTo(map);
  }

  marker.bindPopup(`
    <div class="popup-title popup-type-${loc.type}">${loc.name}</div>
    <div><strong>Type:</strong> ${cfg.label}</div>
    ${loc.detail ? `<div><strong>Detail:</strong> ${loc.detail}</div>` : ''}
    <div style="color:#888;font-size:10px;margin-top:4px">${loc.lat.toFixed(4)}°, ${loc.lng.toFixed(4)}°</div>
  `);
});

const legend = L.control({ position: 'bottomright' });
legend.onAdd = () => {
  const d = L.DomUtil.create('div', 'legend');
  d.innerHTML = Object.entries(TYPE_CONFIG).map(([, cfg]) =>
    `<div class="legend-item">
      <div class="legend-dot" style="background:${cfg.color}"></div>
      ${cfg.label}
    </div>`
  ).join('');
  return d;
};
legend.addTo(map);
</script>
</body>
</html>
