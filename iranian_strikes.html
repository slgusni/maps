<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iranian Retaliation Strikes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; font-family: Arial, sans-serif; background: #111; }
  #container { display: flex; flex-direction: column; width: 100%; height: 100vh; }
  #header {
    background: rgba(0,0,0,0.85); color: #f0e0c0;
    padding: 8px 14px; font-size: 14px; font-weight: bold;
    letter-spacing: 0.5px; border-bottom: 1px solid #444; flex-shrink: 0;
  }
  #header span { font-size: 11px; font-weight: normal; color: #aaa; margin-left: 10px; }
  #map { flex: 1; width: 100%; min-height: 0; }
  .leaflet-container { background: #1a2a3a; }
  .legend { background: rgba(0,0,0,0.75); padding: 8px 12px; border-radius: 6px; color: #ddd; font-size: 11px; line-height: 20px; }
  .legend-item { display: flex; align-items: center; gap: 7px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.4); }
  .leaflet-popup-content-wrapper {
    background: rgba(20,20,30,0.95); color: #eee;
    border: 1px solid #555; border-radius: 6px; box-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }
  .leaflet-popup-tip { background: rgba(20,20,30,0.95); }
  .leaflet-popup-content { margin: 10px 14px; font-size: 12px; line-height: 1.6; }
  .popup-title { font-weight: bold; font-size: 13px; margin-bottom: 4px; }
  .popup-type-strike { color: #ff4444; }
  .popup-type-launch { color: #ff9900; }
  .popup-type-target { color: #ffdd00; }
  .popup-type-idf { color: #0038B8; }
</style>
</head>
<body>

  <div id="header">
    🎯 Iranian Retaliation Strikes

  </div>
  <div id="map"></div>
</div>

    ]
  },

    sources: [

      { label: "@iafsite", url: "https://x.com/iafsite/status/2027730019955437994" }
    ]
  },
  {

  },

  // UAE
  {
    lat: 24.4539, lng: 54.3773,

    sources: []
  },

  {

    sources: [

    ]
  },

  // KUWAIT
  {
    lat: 29.3759, lng: 47.9774,
    name: "Kuwait City, Kuwait",
    type: "strike",
    detail: "Kuwait's Ministry of Defense reported the successful air defense engagement of Ali Al-Salem Air Base against Iranian ballistic missiles. Follow-on strikes resulted in the injury of three Kuwaiti military personnel and minor damage to equipment. A separate attack targeted Kuwait International Airport with attack drones, disrupting operations.",
    sources: [
      { label: "@KuwaitArmyGHQ", url: "https://x.com/kuwaitarmyghq/status/2027722722902446193" },
      { label: "@MofaKuwait", url: "https://x.com/mofakuwait/status/2027696417293152413" }
    ]
  },

  // BAHRAIN
  {
    lat: 26.2361, lng: 50.5860,
    name: "NSA Bahrain / U.S. 5th Fleet HQ",
    type: "strike",
    detail: "The headquarters of the U.S. 5th Fleet in Manama, Bahrain was attacked, according to local officials and reporters from Stars and Stripes. At least one Iranian ballistic missile and a one-way attack drone struck the base, according to several posts on social media. There are no reports of casualties.",
    sources: [
      { label: "@eslavin_stripes", url: "https://x.com/eslavin_stripes/status/2027692129451954506" },
      { label: "@OsintTechnical (1)", url: "https://x.com/osinttechnical/status/2027677928062906449" },
      { label: "@OsintTechnical (2)", url: "https://x.com/osinttechnical/status/2027728415848116482" }
    ]
  },

  // QATAR
  {
    lat: 25.2854, lng: 51.5310,
    name: "Doha, Qatar / Al Udeid Air Base",
    type: "strike",
    detail: "Iran fired at least three waves of missiles at various locations across Qatar. All three waves were intercepted and destroyed before reaching the country's territory, according to the defense ministry. Qatar hosts Al Udeid Air Base, a major hub for American air power operating throughout the Middle East. The base was previously struck during the 12-Day War.",
    sources: [
      { label: "@MofaQatar_EN", url: "https://x.com/mofaqatar_en/status/2027709423007793154" },
      { label: "@mod_qatar", url: "https://x.com/mod_qatar/status/2027707870054387941" }
    ]
  }
];

const TYPE_CONFIG = {
  strike: { color: "#ff3333", label: "Confirmed Strike" },
  target: { color: "#ffdd00", label: "Reported Target" },
  idf: { color: "#0038B8", label: "IDF-Reported Strike in Iran" }
};

const lats = LOCATIONS.map(l => l.lat);
const lngs = LOCATIONS.map(l => l.lng);
const bounds = [[Math.min(...lats)-2, Math.min(...lngs)-2], [Math.max(...lats)+2, Math.max(...lngs)+2]];

const map = L.map('map', {
  zoomControl: true,
  attributionControl: true
}).fitBounds(bounds);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  crossOrigin: true
}).addTo(map);

LOCATIONS.forEach(loc => {
  const cfg = TYPE_CONFIG[loc.type] || TYPE_CONFIG.target;

  const marker = L.circleMarker([loc.lat, loc.lng], {
    radius: 9,
    color: cfg.color,
    fillColor: cfg.color,
    fillOpacity: 0.85,
    weight: 2
  }).addTo(map);

  if (loc.type === 'strike') {
    L.circleMarker([loc.lat, loc.lng], {
      radius: 16, color: cfg.color, fillOpacity: 0, weight: 1, opacity: 0.4
    }).addTo(map);
  }

  const sourceLinks = loc.sources && loc.sources.length
    ? `<div style="margin-top:6px"><strong>Sources:</strong><br>${loc.sources.map(s =>
        `<a href="${s.url}" style="color:#7ab8f5;text-decoration:underline">${s.label}</a>`
      ).join('<br>')}</div>`
    : '';

  marker.bindPopup(`
    <div class="popup-title popup-type-${loc.type}">${loc.name}</div>
    <div><strong>Type:</strong> ${cfg.label}</div>
    ${loc.detail ? `<div style="margin-top:4px">${loc.detail}</div>` : ''}
    ${sourceLinks}
  `, { maxWidth: 260 });
});

// USNI News logo
const logo = L.control({ position: 'bottomleft' });
logo.onAdd = () => {
  const d = L.DomUtil.create('div');
  d.style.cssText = 'padding:4px 6px;background:rgba(0,0,0,0.6);border-radius:4px;';
  d.innerHTML = '<img src="https://news.usni.org/wp-content/uploads/2016/02/usni_logo.png" style="height:28px;display:block;">';
  return d;
};
logo.addTo(map);

// Legend
const legend = L.control({ position: 'bottomright' });
legend.onAdd = () => {
  const d = L.DomUtil.create('div', 'legend');
  d.innerHTML = Object.entries(TYPE_CONFIG).map(([, cfg]) =>
    `<div class="legend-item">
      <div class="legend-dot" style="background:${cfg.color}"></div>
      ${cfg.label}
    </div>`
  ).join('');
  return d;
};
legend.addTo(map);
</script>
</body>
</html>
