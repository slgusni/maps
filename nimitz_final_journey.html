function getSize() {
  return { W: container.clientWidth, H: container.clientHeight };
}

function makeProjection(W, H) {
  // Fit the Americas: lon -170 to -30, lat -60 to 75
  // Use geoMercator fitted to those bounds
  return d3.geoNaturalEarth1()
    .rotate([90, 0])
    .fitExtent([[W * 0.02, H * 0.04], [W * 0.98, H * 0.96]],
      { type: "Feature", geometry: {
          type: "Polygon",
          coordinates: [[
            [-170, 75], [-30, 75], [-30, -60], [-170, -60], [-170, 75]
          ]]
      }}
    );
}

function scaledFontSize(W) {
  return Math.max(9, Math.round(W / 95)) + 'px';
}

function buildLabels(proj, W, H) {
  // Clear old labels
  while (labelDiv.firstChild) labelDiv.removeChild(labelDiv.firstChild);
  labelEls = [];

  var fs = scaledFontSize(W);
  WAYPOINTS.forEach(function(w, i) {
    if (!w.label) return;
    var pt = proj([w.lon, w.lat]);
    if (!pt) return;
    var el = document.createElement('div');
    el.className = 'wp-label';
    el.style.fontSize = fs;
    var ox = 0, oy = 0;
    if (w.anchor === 'right')  { ox = 10;  oy = -6; }
    if (w.anchor === 'left')   { ox = -10; oy = -6; el.style.transform = 'translateX(-100%)'; }
    if (w.anchor === 'above')  { ox = 0;   oy = -20; el.style.transform = 'translateX(-50%)'; }
    if (w.anchor === 'below')  { ox = 0;   oy = 12;  el.style.transform = 'translateX(-50%)'; }
    el.style.left = (pt[0] + ox) + 'px';
    el.style.top  = (pt[1] + oy) + 'px';
    el.textContent = w.label;
    labelDiv.appendChild(el);
    labelEls.push({ el: el, index: i });
  });
}

function drawMap(proj, W, H) {
  mapCanvas.width  = W;
  mapCanvas.height = H;
  routeCanvas.width  = W;
  routeCanvas.height = H;

  var mCtx = mapCanvas.getContext('2d');
  var pathGen = d3.geoPath(proj, mCtx);

  mCtx.fillStyle = '#c8c8c8';
  mCtx.fillRect(0, 0, W, H);

  if (world) {
    var countries = topojson.feature(world, world.objects.countries);
    mCtx.beginPath();
    pathGen(countries);
    mCtx.fillStyle = '#ffffff';
    mCtx.fill();
    mCtx.strokeStyle = '#aaaaaa';
    mCtx.lineWidth = 0.5;
    mCtx.stroke();
  }
}

function projectWaypoints(proj) {
  projected = WAYPOINTS.map(function(w) {
    var pt = proj([w.lon, w.lat]);
    return { label: w.label, anchor: w.anchor, x: pt ? pt[0] : 0, y: pt ? pt[1] : 0 };
  });
}

function redraw(t, W, H) {
  var rCtx = routeCanvas.getContext('2d');
  rCtx.clearRect(0, 0, W, H);

  var segments = projected.length - 1;
  var total = t * segments;
  var full  = Math.floor(total);
  var frac  = total - full;

  var lw = Math.max(1.5, W / 700);
  rCtx.lineJoin = 'round';
  rCtx.lineCap  = 'round';
  rCtx.strokeStyle = ROUTE_COLOR;
  rCtx.lineWidth = lw;
  rCtx.setLineDash([6, 4]);

  for (var i = 0; i < full && i < segments; i++) {
    rCtx.beginPath();
    rCtx.moveTo(projected[i].x, projected[i].y);
    rCtx.lineTo(projected[i+1].x, projected[i+1].y);
    rCtx.stroke();
    drawArrow(rCtx, projected[i], projected[i+1], 1.0, lw);
  }

  if (full < segments) {
    var a = projected[full], b = projected[full+1];
    var ex = a.x + (b.x - a.x) * frac;
    var ey = a.y + (b.y - a.y) * frac;
    rCtx.beginPath();
    rCtx.moveTo(a.x, a.y);
    rCtx.lineTo(ex, ey);
    rCtx.stroke();
    if (frac > 0.4) drawArrow(rCtx, a, { x:ex, y:ey }, frac, lw);
  }

  rCtx.setLineDash([]);
  var dotR = Math.max(3, W / 240);
  for (var j = 0; j <= Math.min(full, segments); j++) {
    var wp  = projected[j];
    var big = (j === 0 || j === segments);
    rCtx.beginPath();
    rCtx.arc(wp.x, wp.y, big ? dotR * 1.4 : dotR, 0, Math.PI*2);
    rCtx.fillStyle = DOT_COLOR;
    rCtx.fill();
    rCtx.strokeStyle = DOT_STROKE;
    rCtx.lineWidth = lw * 0.7;
    rCtx.stroke();
  }

  var lastReached = -1;
  labelEls.forEach(function(obj) {
    if (obj.index <= full) lastReached = obj.index;
  });
  labelEls.forEach(function(obj) {
    obj.el.style.opacity = (obj.index === lastReached) ? '1' : '0';
  });
}

function drawArrow(ctx, a, b, alpha, lw) {
  var dx = b.x - a.x, dy = b.y - a.y;
  var len = Math.sqrt(dx*dx + dy*dy);
  if (len < 14) return;
  var ux = dx/len, uy = dy/len;
  var mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
  var s = Math.max(4, lw * 3);
  ctx.save();
  ctx.setLineDash([]);
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = ROUTE_COLOR;
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(mx + ux*s - uy*s*0.5, my + uy*s + ux*s*0.5);
  ctx.lineTo(mx + ux*s,            my + uy*s           );
  ctx.lineTo(mx + ux*s + uy*s*0.5, my + uy*s - ux*s*0.5);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();
}

// Scale title text
function scaleTitles(W) {
  var h1 = document.getElementById('title-h1');
  var p  = document.getElementById('title-p');
  var fs = Math.max(11, Math.round(W / 80));
  h1.style.fontSize = fs + 'px';
  p.style.fontSize  = fs + 'px';
}

// Scale slider
function scaleControls(W) {
  var slider = document.getElementById('progress-slider');
  slider.style.width = Math.max(160, Math.round(W * 0.25)) + 'px';
}

function fullRender() {
  var s = getSize();
  var W = s.W, H = s.H;
  var proj = makeProjection(W, H);
  projectWaypoints(proj);
  drawMap(proj, W, H);
  buildLabels(proj, W, H);
  scaleTitles(W);
  scaleControls(W);
  redraw(currentProgress, W, H);
}

function loadScript(src, cb) {
  var s = document.createElement('script');
  s.src = src; s.onload = cb;
  s.onerror = function() { statusEl.textContent = 'Failed to load: ' + src; };
  document.head.appendChild(s);
}

loadScript('https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js', function() {
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js', function() {
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
      .then(function(r) { return r.json(); })
      .then(function(w) {
        world = w;
        statusEl.style.display = 'none';
        fullRender();

        var slider = document.getElementById('progress-slider');
        var valueDisplay = document.getElementById('progress-value');
        slider.addEventListener('input', function() {
          currentProgress = parseInt(slider.value) / 100;
          var s = getSize();
          redraw(currentProgress, s.W, s.H);
          valueDisplay.textContent = slider.value;
        });

        var resizeTimer;
        window.addEventListener('resize', function() {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(fullRender, 100);
        });
      })
      .catch(function() {
        statusEl.textContent = 'Map data failed to load.';
      });
  });
});

})();
</script>
