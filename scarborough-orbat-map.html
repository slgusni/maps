<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scarborough Shoal — Order of Battle</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; font-family: Arial, sans-serif; background: #111; }
  #container { display: flex; flex-direction: column; width: 100%; height: 100vh; }
  #header {
    background: rgba(0,0,0,0.85); color: #f0e0c0;
    padding: 8px 14px; font-size: 14px; font-weight: bold;
    letter-spacing: 0.5px; border-bottom: 1px solid #444; flex-shrink: 0;
  }
  #header span { font-size: 11px; font-weight: normal; color: #aaa; margin-left: 10px; }
  #map { flex: 1; width: 100%; min-height: 0; }
  .leaflet-container { background: #1a2a3a; cursor: default !important; }

  .orbat-box {
    background: rgba(10,10,20,0.88);
    border-radius: 8px;
    padding: 10px 14px;
    font-family: Arial, sans-serif;
    min-width: 230px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.6);
  }
  .orbat-title {
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.5px;
    padding-bottom: 6px;
    margin-bottom: 6px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .orbat-us { border: 1.5px solid #4a90d9; }
  .orbat-us .orbat-title { color: #7ab8f5; }
  .orbat-cn { border: 1.5px solid #e84040; }
  .orbat-cn .orbat-title { color: #ff7070; }
  .orbat-item {
    font-size: 10.5px;
    color: #ddd;
    padding: 2.5px 0;
    display: flex;
    align-items: center;
    gap: 7px;
    line-height: 1.35;
  }
  .sil {
    font-size: 13px;
    flex-shrink: 0;
    width: 18px;
    text-align: center;
  }

  @keyframes pulse {
    0%   { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
    50%  { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
    100% { transform: translate(-50%, -50%) scale(1);   opacity: 0; }
  }
  .pulse-container { position: relative; width: 16px; height: 16px; }
  .pulse-dot {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 12px; height: 12px; border-radius: 50%;
    background: #ff3333; z-index: 2;
    box-shadow: 0 0 6px rgba(255,50,50,0.8);
  }
  .pulse-ring {
    position: absolute; top: 50%; left: 50%;
    width: 12px; height: 12px; border-radius: 50%;
    background: #ff3333;
    animation: pulse 2s ease-out infinite;
    z-index: 1;
  }

  @media (max-width: 600px) {
    .orbat-box { min-width: 170px; padding: 8px 10px; }
    .orbat-item { font-size: 9px; }
    .orbat-title { font-size: 10px; }
  }
</style>
</head>
<body>
<div id="container">
  <div id="header">
    ⚓ Scarborough Shoal — Order of Battle
    <span>South China Sea</span>
  </div>
  <div id="map"></div>
</div>
<script>
const LAT = 15.2191;
const LNG = 117.7403;

const map = L.map('map', {
  center: [LAT, LNG],
  zoom: 7,
  zoomControl: false,
  dragging: false,
  scrollWheelZoom: false,
  doubleClickZoom: false,
  touchZoom: false,
  keyboard: false,
  boxZoom: false,
  attributionControl: true
});

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  crossOrigin: true
}).addTo(map);

// Pulsing marker at Scarborough Shoal
const pulseIcon = L.divIcon({
  className: '',
  html: `<div class="pulse-container">
    <div class="pulse-ring"></div>
    <div class="pulse-dot"></div>
  </div>`,
  iconAnchor: [8, 8]
});
L.marker([LAT, LNG], { icon: pulseIcon, interactive: false }).addTo(map);

// Shoal label
L.marker([LAT, LNG], {
  icon: L.divIcon({
    className: '',
    html: `<div style="color:#fff;font-weight:bold;font-size:12px;white-space:nowrap;
           text-shadow:1px 1px 3px #000,-1px -1px 3px #000;
           padding-left:14px;margin-top:-8px">Scarborough Shoal</div>`,
    iconAnchor: [0, 0]
  }),
  interactive: false
}).addTo(map);

// ── PHILIPPINES / U.S. ORBAT (top left) ──────────────────────
const usOrbat = L.control({ position: 'topleft' });
usOrbat.onAdd = () => {
  const d = L.DomUtil.create('div', 'orbat-box orbat-us');
  d.innerHTML = `
    <div class="orbat-title">🇵🇭 PHILIPPINES &amp; 🇺🇸 U.S.</div>
    <div class="orbat-item"><span class="sil">⛴</span>BRP Melchora Aquino (MRRV-9702)</div>
    <div class="orbat-item"><span class="sil">⛴</span>BRP Capones (MRRV-4404)</div>
    <div class="orbat-item"><span class="sil">🚢</span>BRP Antonio Luna (FF-151)</div>
    <div class="orbat-item"><span class="sil">⛴</span>USCGC Charles Moulthrope (WPC-1141)</div>
    <div class="orbat-item"><span class="sil">⛴</span>USCGC Emlen Tunnell (WPC-1145)</div>
  `;
  return d;
};
usOrbat.addTo(map);

// ── CHINA ORBAT (top right) ──────────────────────────────────
const cnOrbat = L.control({ position: 'topright' });
cnOrbat.onAdd = () => {
  const d = L.DomUtil.create('div', 'orbat-box orbat-cn');
  d.innerHTML = `
    <div class="orbat-title">🇨🇳 CHINA</div>
    <div class="orbat-item"><span class="sil">🚢</span>Type 054A Frigate Tongliao (554)</div>
    <div class="orbat-item"><span class="sil">🚢</span>Type 056A Corvette Hanzhong (648)</div>
    <div class="orbat-item"><span class="sil">✈</span>2× H-6K Bombers</div>
    <div class="orbat-item"><span class="sil">✈</span>2× Su-30 Fighters</div>
    <div class="orbat-item"><span class="sil">✈</span>1× KJ-500H AEW&amp;C Aircraft</div>
    <div class="orbat-item"><span class="sil">✈</span>1× Y-8Q Maritime Patrol Aircraft</div>
  `;
  return d;
};
cnOrbat.addTo(map);

// USNI News logo
const logo = L.control({ position: 'bottomleft' });
logo.onAdd = () => {
  const d = L.DomUtil.create('div');
  d.style.cssText = 'padding:4px 6px;background:rgba(0,0,0,0.6);border-radius:4px;';
  d.innerHTML = '<img src="https://news.usni.org/wp-content/uploads/2016/02/usni_logo.png" style="height:28px;display:block;">';
  return d;
};
logo.addTo(map);
</script>
</body>
</html>
