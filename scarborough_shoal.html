<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scarborough Shoal — PLAN Combat Patrol Weapons Range</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; font-family: Arial, sans-serif; background: #111; }
  #container { display: flex; flex-direction: column; width: 100%; height: 100vh; }
  #header {
    background: rgba(0,0,0,0.85); color: #f0e0c0;
    padding: 8px 14px; font-size: 14px; font-weight: bold;
    letter-spacing: 0.5px; border-bottom: 1px solid #444; flex-shrink: 0;
  }
  #header span { font-size: 11px; font-weight: normal; color: #aaa; margin-left: 10px; }
  #map { flex: 1; width: 100%; min-height: 0; }
  .leaflet-container { background: #1a2a3a; }

  .legend {
    background: rgba(0,0,0,0.8); padding: 10px 12px;
    border-radius: 6px; color: #ddd; font-size: 11px; line-height: 1.5;
    max-width: 220px;
  }
  .legend h4 { font-size: 11px; color: #fff; margin: 6px 0 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .legend h4:first-child { margin-top: 0; }
  .legend-item { display: flex; align-items: center; gap: 7px; padding: 1.5px 0; }
  .legend-line { width: 22px; height: 0; border-top: 2px dashed; flex-shrink: 0; }

  .leaflet-popup-content-wrapper {
    background: rgba(20,20,30,0.95); color: #eee;
    border: 1px solid #555; border-radius: 6px;
  }
  .leaflet-popup-tip { background: rgba(20,20,30,0.95); }
  .leaflet-popup-content { margin: 10px 14px; font-size: 12px; line-height: 1.6; }
  .popup-title { font-weight: bold; font-size: 13px; color: #f0e0c0; margin-bottom: 4px; }
</style>
</head>
<body>
<div id="container">
  <div id="header">
    Scarborough Shoal — PLAN Combat Patrol Weapons Range
    <span>Chinese Navy Strike &amp; Air Defense Envelopes</span>
  </div>
  <div id="map"></div>
</div>
<script>
const LAT = 15.2191;
const LNG = 117.7403;

// Missile ranges in nautical miles
const RINGS = [
  // Strike weapons
  { nm: 810, color: "#ff2b2b", label: "YJ-20", category: "strike" },
  { nm: 290, color: "#ff6b2b", label: "YJ-18", category: "strike" },
  { nm: 270, color: "#ffa12b", label: "YJ-12", category: "strike" },
  { nm: 97,  color: "#ffd52b", label: "YJ-83", category: "strike" },
  // Air defense
  { nm: 162, color: "#2bb0ff", label: "HHQ-9",  category: "airdefense" },
  { nm: 30,  color: "#2bffd5", label: "HHQ-16", category: "airdefense" }
];

// Fit map to largest ring (810 nm ~ 1500 km)
const map = L.map('map', {
  center: [LAT, LNG],
  zoom: 5,
  zoomControl: true,
  attributionControl: true
});

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  crossOrigin: true
}).addTo(map);

// Draw rings largest first
[...RINGS].sort((a, b) => b.nm - a.nm).forEach(r => {
  const radiusM = r.nm * 1852;
  L.circle([LAT, LNG], {
    radius: radiusM,
    color: r.color,
    weight: 2,
    fillColor: r.color,
    fillOpacity: 0.04,
    dashArray: '6 4',
    interactive: false
  }).addTo(map);

  // Label at top of ring
  const dLat = (radiusM / 6371000) * (180 / Math.PI);
  L.marker([LAT + dLat, LNG], {
    icon: L.divIcon({
      className: '',
      html: `<div style="color:${r.color};font-size:10px;font-weight:bold;white-space:nowrap;
             text-shadow:1px 1px 3px #000,-1px -1px 3px #000;
             transform:translateX(-50%);font-family:Arial;">${r.label} — ${r.nm} nm</div>`,
      iconAnchor: [0, 8]
    }),
    interactive: false
  }).addTo(map);
});

// Center marker
L.circleMarker([LAT, LNG], {
  radius: 6, color: '#fff', fillColor: '#ff3333', fillOpacity: 1, weight: 2
}).addTo(map).bindPopup(`
  <div class="popup-title">Scarborough Shoal</div>
  <div>Notional PLAN combat patrol position</div>
  <div style="color:#888;font-size:10px;margin-top:4px">15.2191°N, 117.7403°E</div>
`);

L.marker([LAT, LNG], {
  icon: L.divIcon({
    className: '',
    html: `<div style="color:#fff;font-weight:bold;font-size:11px;white-space:nowrap;
           text-shadow:1px 1px 3px #000,-1px -1px 3px #000;
           padding-left:12px;margin-top:-7px">Scarborough Shoal</div>`,
    iconAnchor: [0, 0]
  }),
  interactive: false
}).addTo(map);

// Legend
const legend = L.control({ position: 'bottomright' });
legend.onAdd = () => {
  const d = L.DomUtil.create('div', 'legend');
  const strike = RINGS.filter(r => r.category === 'strike');
  const ad = RINGS.filter(r => r.category === 'airdefense');
  d.innerHTML =
    '<h4>Anti-Ship / Strike</h4>' +
    strike.map(r => `<div class="legend-item"><span class="legend-line" style="border-color:${r.color}"></span>${r.label} — ${r.nm} nm</div>`).join('') +
    '<h4>Air Defense</h4>' +
    ad.map(r => `<div class="legend-item"><span class="legend-line" style="border-color:${r.color}"></span>${r.label} — ${r.nm} nm</div>`).join('');
  return d;
};
legend.addTo(map);

// USNI News logo
const logo = L.control({ position: 'bottomleft' });
logo.onAdd = () => {
  const d = L.DomUtil.create('div');
  d.style.cssText = 'padding:4px 6px;background:rgba(0,0,0,0.6);border-radius:4px;';
  d.innerHTML = '<img src="https://news.usni.org/wp-content/uploads/2016/02/usni_logo.png" style="height:28px;display:block;">';
  return d;
};
logo.addTo(map);
</script>
</body>
</html>
